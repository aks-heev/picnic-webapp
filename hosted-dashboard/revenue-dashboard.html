        <table class="pnl"><tbody>
          <tr><td>Picnic booking profit</td><td class="num strong" style="color:var(--olive)">${pnlLine(pnl.picnicProfit)}</td></tr>
          <tr><td>Airbnb net earnings</td><td class="num strong" style="color:var(--olive)">${pnlLine(pnl.stayProfit)}</td></tr>
          <tr><td>Operating expenses <span style="color:var(--muted);font-size:12px">· ${pnl.exp.length} item${pnl.exp.length === 1 ? '' : 's'}</span></td><td class="num strong" style="color:var(--red)">${pnlLine(-pnl.expTotal)}</td></tr>
          <tr class="total"><td>Overall net</td><td class="num" style="color:var(--${pnl.overallNet < 0 ? 'red' : 'olive'})">${(pnl.overallNet < 0 ? '− ' : '') + inr(Math.abs(pnl.overallNet))}</td></tr>
        </tbody></table>
        <p class="note">Booking profit is per-event margin before overhead. Picnic and Airbnb are kept on separate lines so operating expenses — mostly Airbnb rent — don’t make the picnic side read as unprofitable. Single-digit monthly volume: treat every rate as directional.</p>
      </div></div>
      <div class="card"><div class="card-h"><h3>Expenses by category</h3><p>${period}</p></div>
        <div class="card-b"><div class="chart-box sm"><canvas id="c-expcat"></canvas></div></div></div>
    </div>
    <div class="card detail-only"><div class="card-h"><h3>Expense line items</h3><p>Synced nightly from the workbook’s Expenses tab</p></div><div class="card-b" style="padding-top:6px"><div id="t-exp"></div></div></div>

    <div class="sec"><h2>Occupancy</h2><span class="hint">TerraCottage (self-managed) venues · nights booked / nights the venue has been listed · confirmed bookings only</span></div>
    <div class="grid2">
      <div class="card"><div class="card-h"><h3>By month</h3><p>Nights booked ÷ nights listed, per venue · full history</p></div>
        <div class="card-b"><div class="chart-box"><canvas id="c-occ"></canvas></div></div></div>
      <div class="card"><div class="card-h"><h3>${period}</h3><p>By event date, not booked-on</p></div>
        <div class="card-b" style="padding-top:2px"><div id="t-occ"></div></div></div>
    </div>

    <div class="sec"><h2>${owedActive ? 'Awaiting payment' : 'Bookings'}</h2><span class="hint">${owedActive ? `${owedRows.length} booking${owedRows.length === 1 ? '' : 's'} with a balance · all periods · full amounts, not split` : `${rows.length} in ${period} · click a column to sort`}</span>${owedActive ? `<span class="right"><button type="button" class="btn" onclick="showOwed()">Back to ${esc(period)}</button></span>` : ''}</div>
    <div class="card"><div class="card-b" style="padding-top:6px"><div id="t-all"></div></div></div>

    <div class="foot">
      <strong>Basis.</strong> <em>Event date</em> places money in the month the booking is delivered and splits a stay across the months its nights fall in — a 31 Aug → 7 Sep stay puts 1 night in August and 6 in September. <em>Booked on</em> places the whole booking in the month it was created. Owed-to-me is never split: a balance is due in full regardless of period.
      <span class="detail-only"><br><strong>Sources.</strong> Google Sheet “THEPIC~3” plus the live Supabase <code>bookings</code> table, re-read on every open; team numbers and <code>Test*</code> names excluded.
      <strong>Channel.</strong> <span class="badge b-live">Website</span> booked through picnicstories.com · <span class="badge b-plain">Direct</span> entered by the team — WhatsApp, walk-in or a direct extension · <span class="badge b-airbnb">Airbnb</span> came through the platform and carries its confirmation code.</span>
    </div>`;

  // controls
  const bind = (id, key) => { const el = document.getElementById(id); if (el) el.addEventListener('change', e => { S.filters[key] = e.target.value; render(); }); };
  bind('f-basis', 'basis'); bind('f-month', 'month'); bind('f-type', 'type'); bind('f-venue', 'venue'); bind('f-channel', 'channel'); bind('f-status', 'status');
  const q = document.getElementById('f-q');
  if (q) q.addEventListener('input', e => { S.filters.q = e.target.value; render(); const n = document.getElementById('f-q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
  const reset = document.getElementById('f-reset');
  if (reset) reset.addEventListener('click', () => { Object.assign(S.filters, { type: 'all', venue: 'all', channel: 'all', status: 'all', q: '', upcoming: false, owing: false, exposed: false }); render(); });

  renderHealth(exposed, mismatches, splitRows, gaps, healthItems);
  renderOccupancy();
  renderCalendar();

  const cols = [
    { key: 'date', label: 'Date', render: r => r.kind === 'stay' && r.endDate ? `<span class="strong">${fmtShort(r.date)}</span> → ${fmtShort(r.endDate)}` : `<span class="strong">${fmtDate(r.date)}</span>`, sort: r => r.date ? r.date.getTime() : 0 },
    { key: 'name', label: 'Guest' },
    { key: 'venue', label: 'Venue' },
    { key: 'kind', label: 'Type', render: kindBadge },
    { key: 'total', label: (monthScoped && !owedActive) ? 'Total (in period)' : 'Total', num: true,
      render: r => {
        // In the owed view every figure is the whole booking — a balance is due in
        // full regardless of which months the stay spans.
        const share = owedActive ? 1 : (r.share == null ? 1 : r.share);
        const tag = share < 1 ? ` <span class="split" title="${esc(inr(r.total))} over ${r.nights} nights">${Math.round(share * 100)}%</span>` : '';
        const mm = D && r.mismatch ? ` <span class="badge b-sheet" title="${esc(r.mismatch)}">≠ live</span>` : '';
        return inr(r.total * share) + tag + mm;
      }, sort: r => r.total * (owedActive ? 1 : (r.share == null ? 1 : r.share)) },
    { key: 'balance', label: 'Balance', num: true, render: r => r.balance > 0 ? `<span class="strong" style="color:var(--amber)">${inr(r.balance)}</span>` : '<span style="color:var(--muted)">—</span>', sort: r => r.balance },
    { key: 'payment', label: 'Payment', render: payBadge },
    { key: 'status', label: 'Status', render: r => `<span class="badge b-plain">${esc(r.status || '—')}</span>` },
  ];
  if (D) cols.push(
    { key: 'bookingId', label: 'ID' },
    { key: 'channel', label: 'Channel' },
    { key: 'phone', label: 'Phone' },
    { key: 'bookedOn', label: 'Booked on', render: r => r.bookedOn ? fmtDate(r.bookedOn) : '<span style="color:var(--muted)">—</span>', sort: r => r.bookedOn ? r.bookedOn.getTime() : 0 },
    { key: 'advance', label: 'Advance', num: true, render: r => inr(r.advance), sort: r => r.advance },
    { key: 'bkid', label: 'Live system', render: syncBadge, sort: r => r.live ? 2 : (r.expectedLive ? 0 : 1) },
  );
  makeTable(document.getElementById('t-all'), tableRows, cols, owedActive ? 5 : 0, -1, owedActive ? 'Nothing outstanding — every booking is settled.' : undefined);

  if (D) makeTable(document.getElementById('t-exp'), pnl.exp, [
    { key: 'date', label: 'Date', render: e => fmtDate(e.date), sort: e => e.date ? e.date.getTime() : 0 },
    { key: 'business', label: 'Business', render: e => `<span class="badge b-plain">${esc(e.business)}</span>` },
    { key: 'category', label: 'Category' },
    { key: 'description', label: 'Description' },
    { key: 'amount', label: 'Amount', num: true, render: e => inr(e.amount), sort: e => e.amount },
  ], 4, -1, 'No expenses logged in this period.');

  drawCharts(rows);
}

/* Data health: one calm line by default; the full alerts only on request or in
   detail view.
   🔴 The Cowork build could honestly say "reconciled" because it held two sources
   and compared them. This build has one, so the strip states the source instead.
   Do not restore the word "reconciled" here unless a second source comes back. */
function occBand(pct) { return pct >= 75 ? 'olive' : pct >= 45 ? 'amber' : 'red'; }
function occChip(curPct, prevPct) {
  if (prevPct == null) return `<span class="chip flat">first month</span>`;
  const d = curPct - prevPct;
  const cls = Math.abs(d) < 0.5 ? 'flat' : (d > 0 ? 'up' : 'down');
  const arrow = cls === 'flat' ? '—' : (d > 0 ? '▲' : '▼');
  return `<span class="chip ${cls}" title="vs last month: ${d >= 0 ? '+' : '−'}${Math.abs(d).toFixed(1)}pt">${arrow} ${Math.abs(d).toFixed(1)}pt</span>`;
}
function occRows() {
  return (S.occupancy || []).map(o => ({
    venue: o.venue_name,
    monthKey: String(o.month).slice(0, 7),
    activeDays: o.active_days,
    nights: o.nights_booked,
    pct: Number(o.occupancy_pct),
  }));
}
function renderOccupancy() {
  const mount = document.getElementById('t-occ');
  if (!mount) return;
  const rows = occRows();
  if (!rows.length) { mount.innerHTML = '<div class="empty occ-empty">No active self-managed (TerraCottage) venues, or the occupancy view is not available.</div>'; return; }
  const f = S.filters;
  /* Follow the Period control at the top of the page instead of dumping every
     month into one table — "all months" falls back to a full table (nothing to
     scope to), but picking a month reads like the dashboard's other period cards:
     a filled meter for scan-at-a-glance, and a vs-last-month trend, since a bare
     percentage doesn't say whether 77% is improving or sliding. */
  if (f.month !== 'all') {
    const here = rows.filter(r => r.monthKey === f.month).sort((a, b) => b.pct - a.pct);
    if (!here.length) { mount.innerHTML = `<div class="empty occ-empty">No self-managed bookings data for ${esc(monthLabel(f.month))}.</div>`; return; }
    const prevKey = prevMonthKey(f.month);
    const prevByVenue = new Map(rows.filter(r => r.monthKey === prevKey).map(r => [r.venue, r.pct]));
    const totalNights = here.reduce((s, r) => s + r.nights, 0);
    const totalDays = here.reduce((s, r) => s + r.activeDays, 0);
    const blended = totalDays ? (totalNights / totalDays * 100) : 0;
    /* Avg nightly rate = stay revenue / nights, per venue, for the selected month.
       Always by EVENT date (same per-night proration as the occupancy nights),
       regardless of the Booked-on/Event basis toggle, so the rate matches the
       nights shown above it. Stays straddling a month boundary contribute only
       the nights (and the matching share of total) that fall in this month.
       Stay totals are what was recorded on the booking, so Airbnb-originated
       stays that record only our cut pull the average down. */
    const adr = new Map(); let adrRev = 0, adrNights = 0;
    S.records.forEach(r => {
      if (r.kind !== 'stay') return;
      const hit = spans(r, 'event').find(x => x.k === f.month);
      if (!hit || !(hit.nights > 0)) return;
      const a = adr.get(r.venue) || { rev: 0, nights: 0 };
      a.rev += r.total * hit.share; a.nights += hit.nights;
      adr.set(r.venue, a);
      adrRev += r.total * hit.share; adrNights += hit.nights;
    });
    const adrText = v => { const a = adr.get(v); return a && a.nights ? `${inr(a.rev / a.nights)} / night` : '—'; };
    mount.innerHTML = here.map(r => {
      const band = occBand(r.pct);
      return `<div class="occ-row">
        <div class="top">
          <span class="name">${esc(r.venue)}</span>
          ${occChip(r.pct, prevByVenue.has(r.venue) ? prevByVenue.get(r.venue) : null)}
        </div>
        <div class="pct"><b style="color:var(--${band})">${r.pct.toFixed(1)}%</b></div>
        <div class="occ-bar" style="margin-top:10px"><i style="width:${Math.min(100, r.pct)}%; background:var(--${band})"></i></div>
        <div class="s">${r.nights} of ${r.activeDays} night${r.activeDays === 1 ? '' : 's'} listed</div>
        <div class="s occ-adr">Avg nightly rate <b>${adrText(r.venue)}</b></div>
      </div>`;
    }).join('') +
      (here.length > 1 ? `<div class="occ-note">Blended across ${here.length} venues: <b>${blended.toFixed(1)}%</b> (${totalNights} of ${totalDays} nights)${adrNights ? ` · Avg nightly rate <b>${inr(adrRev / adrNights)}</b>` : ''}</div>` : '');
    return;
  }
  const sorted = rows.slice().sort((a, b) => b.monthKey.localeCompare(a.monthKey) || a.venue.localeCompare(b.venue));
  const cols = [
    { key: 'monthKey', label: 'Month', render: r => esc(monthLabel(r.monthKey)) },
    { key: 'venue', label: 'Venue', render: r => esc(r.venue) },
    { key: 'nights', label: 'Nights booked', num: true },
    { key: 'activeDays', label: 'Active days', num: true },
    { key: 'pct', label: 'Occupancy', num: true, render: r => `<b style="color:var(--${occBand(r.pct)})">${r.pct.toFixed(1)}%</b>` },
  ];
  makeTable(mount, sorted, cols, 0, -1);
}

function renderHealth(exposed, mismatches, splitRows, gaps, n) {
  const host = document.getElementById('health');
  const f = S.filters, open = S.healthOpen || S.detail;
  let strip = '';
  if (!n) strip = `<div class="health ok"><b>✓ Live</b> read directly from the booking system${splitRows.length ? ` · ${splitRows.length} stay${splitRows.length === 1 ? '' : 's'} split across the month boundary` : ''}${f.basis === 'booked' && gaps ? ` · ${gaps} row${gaps === 1 ? '' : 's'} counted by event date` : ''}</div>`;
  else strip = `<div class="health warn"><b>Data health · ${n} item${n === 1 ? '' : 's'}</b> to tidy in the workbook — the figures above already count each booking once${splitRows.length ? ` · ${splitRows.length} split stay${splitRows.length === 1 ? '' : 's'}` : ''}<button type="button" class="btn" onclick="toggleHealth()">${open ? 'Hide' : 'Show'}</button></div>`;
  let detail = '';
  if (open) {
    if (exposed.length) detail += `<div class="alert warn"><div>⚠️</div><div><h4>${exposed.length} upcoming booking${exposed.length === 1 ? '' : 's'} not in the live system</h4><p>These exist only in the sheet, so nothing stops the website taking another booking on the same date and slot.</p><ul>${exposed.map(r => `<li><strong>${esc(r.name)}</strong> — ${esc(r.venue)}, ${fmtDate(r.date)}</li>`).join('')}</ul></div></div>`;
    if (mismatches.length) detail += `<div class="alert warn"><div>🔢</div><div><h4>${mismatches.length} amount mismatch${mismatches.length === 1 ? '' : 'es'}</h4><ul>${mismatches.map(r => `<li><strong>${esc(r.name)}</strong> — ${esc(r.mismatch)}</li>`).join('')}</ul></div></div>`;
    if (S.dupWarnings && S.dupWarnings.length) detail += `<div class="alert warn"><div>👥</div><div><h4>${S.dupWarnings.length} booking${S.dupWarnings.length === 1 ? '' : 's'} on more than one sheet row</h4><ul>${S.dupWarnings.map(w => `<li><strong>${esc(w.keep.name)}</strong> · live #${esc(w.liveId)} — keep <strong>${esc(w.keep.bookingId || '—')}</strong>, delete ${w.dups.map(d => `<strong>${esc(d.bookingId || '—')}</strong>`).join(', ')}</li>`).join('')}</ul></div></div>`;
    if (S.dbOk && S.orphans && S.orphans.length) detail += `<div class="alert warn"><div>📄</div><div><h4>${S.orphans.length} confirmed live booking${S.orphans.length === 1 ? '' : 's'} missing from the sheet</h4><ul>${S.orphans.map(r => `<li><strong>${esc(r.full_name)}</strong> — ${esc(r.venue_name || '—')}, ${fmtDate(parseDate(r.preferred_date))} · ${inr(money(r.total_amount))} <span style="color:var(--muted)">(live #${esc(r.id)})</span></li>`).join('')}</ul></div></div>`;
    if (splitRows.length) detail += `<div class="alert info"><div>✂️</div><div><h4>${splitRows.length} stay${splitRows.length === 1 ? '' : 's'} split across the month boundary</h4><ul>${splitRows.map(r => `<li><strong>${esc(r.name)}</strong> — ${fmtShort(r.date)} → ${fmtShort(r.endDate)} · ${r.shareNights} of ${r.nights} nights · ${inr(r.total * r.share)} of ${inr(r.total)}</li>`).join('')}</ul></div></div>`;
    if (f.basis === 'booked' && gaps) detail += `<div class="alert info"><div>🗓️</div><div><h4>${gaps} row${gaps === 1 ? '' : 's'} have no booked-on date</h4><p>Hand-entered rows carry no <code>_bkid</code>, so the sync never stamped one. They are counted under their event date instead of being dropped.</p></div></div>`;
  }
  host.innerHTML = strip + detail;
}

function drawCharts(rows) {
  Object.values(S.charts).forEach(c => { try { c.destroy(); } catch (e) {} });
  S.charts = {};
  const axis = { grid: { color: '#ede6db', drawBorder: false }, ticks: { color: '#6b6259', font: { size: 11.5 } } };
  const f = S.filters;

  // Revenue by month — always the full timeline so the trend reads even when a
  // single period is selected; the selected month is highlighted.
  const base = view({ month: 'all' });
  const acc = {};
  base.forEach(r => spans(r).forEach(s => { if (!acc[s.k]) acc[s.k] = { picnic: 0, stay: 0 }; acc[s.k][r.kind] += r.total * s.share; }));
  const mk = Object.keys(acc).sort();
  const pic = mk.map(k => acc[k].picnic), sta = mk.map(k => acc[k].stay);
  const tot = mk.map((k, i) => pic[i] + sta[i]);
  const roll = tot.map((_, i) => { const w = tot.slice(Math.max(0, i - 2), i + 1); return w.reduce((a, b) => a + b, 0) / w.length; });
  const sel = k => (f.month === 'all' || f.month === k);
  const cm = document.getElementById('c-month');
  if (cm && mk.length) {
    // Draws the month's combined picnic+stay figure above the stack. Reads
    // the 'Stay' bar (dataset 1) since it's the top segment of the stack, so
    // its pixel y IS the top of the whole bar -- no separate scale lookup.
    const totalLabelPlugin = {
      id: 'monthTotalLabel',
      afterDatasetsDraw(chart) {
        const meta = chart.getDatasetMeta(1);
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        ctx.fillStyle = '#2a2521';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        meta.data.forEach((bar, i) => {
          if (!tot[i]) return;
          ctx.fillText(inrShort(tot[i]), bar.x, bar.y - 6);
        });
        ctx.restore();
      }
    };
    S.charts.month = new Chart(cm.getContext('2d'), {
      data: { labels: mk.map(monthLabel), datasets: [
        { type: 'bar', label: 'Picnic', data: pic, backgroundColor: mk.map(k => sel(k) ? '#b8552a' : '#e6c2b0'), borderRadius: 4, stack: 'r', order: 2 },
        { type: 'bar', label: 'Stay', data: sta, backgroundColor: mk.map(k => sel(k) ? '#5c6b42' : '#c9d0b8'), borderRadius: 4, stack: 'r', order: 2 },
        { type: 'line', label: '3-mo avg', data: roll, borderColor: '#2a2521', borderWidth: 1.5, pointRadius: 2.5, pointBackgroundColor: '#2a2521', tension: .3, fill: false, order: 1 } ] },
      options: { responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 22 } },
        interaction: { mode: 'index', intersect: false },
        scales: { x: { ...axis, stacked: true }, y: { ...axis, stacked: true, beginAtZero: true, ticks: { ...axis.ticks, callback: v => inrShort(v) } } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 11, font: { size: 11.5 }, color: '#4f463d' } },
          tooltip: { callbacks: { label: c => `${c.dataset.label}: ${inr(c.parsed.y)}`,
            footer: items => items.length ? `Total: ${inr(tot[items[0].dataIndex])}` : '' } } } },
      plugins: [totalLabelPlugin]
    });
  } else if (cm) cm.parentElement.innerHTML = '<div class="empty">No data in range.</div>';

  // Occupancy by month — one line per self-managed venue, full history (like
  // the revenue chart above, the trend matters more than the selected period).
  const occ = occRows();
  const occMonths = Array.from(new Set(occ.map(r => r.monthKey))).sort();
  const occVenues = Array.from(new Set(occ.map(r => r.venue))).sort();
  const occColors = ['#b8552a', '#5c6b42', '#8f6512', '#6b6259'];
  const co = document.getElementById('c-occ');
  if (co && occMonths.length && occVenues.length) {
    const byKey = new Map(occ.map(r => [r.venue + '|' + r.monthKey, r.pct]));
    S.charts.occupancy = new Chart(co.getContext('2d'), {
      type: 'line',
      data: { labels: occMonths.map(monthLabel), datasets: occVenues.map((v, i) => ({
        label: v,
        data: occMonths.map(k => byKey.has(v + '|' + k) ? byKey.get(v + '|' + k) : null),
        borderColor: occColors[i % occColors.length],
        backgroundColor: occColors[i % occColors.length],
        borderWidth: 2, pointRadius: 3.5, pointBackgroundColor: occColors[i % occColors.length],
        tension: .3, fill: false, spanGaps: true,
      })) },
      options: { responsive: true, maintainAspectRatio: false,
        scales: { x: axis, y: { ...axis, min: 0, max: 100, ticks: { ...axis.ticks, callback: v => v + '%' } } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 11, font: { size: 11.5 }, color: '#4f463d' } },
          tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(1)}%` } } } }
    });
  } else if (co) co.parentElement.innerHTML = '<div class="empty">No occupancy data yet.</div>';

  const byV = {};
  rows.forEach(r => { byV[r.venue] = (byV[r.venue] || 0) + r.total * (r.share == null ? 1 : r.share); });
  const vk = Object.keys(byV).sort((a, b) => byV[b] - byV[a]);
  const cv = document.getElementById('c-venue');
  if (cv && vk.length) {
    S.charts.venue = new Chart(cv.getContext('2d'), { type: 'bar',
      data: { labels: vk, datasets: [{ label: 'Revenue', data: vk.map(k => byV[k]), backgroundColor: '#b8552a', borderRadius: 4 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        scales: { x: { ...axis, beginAtZero: true, ticks: { ...axis.ticks, callback: v => inrShort(v) } }, y: axis },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => inr(c.parsed.x) } } } } });
  } else if (cv) cv.parentElement.innerHTML = '<div class="empty">No data in range.</div>';

  const exp = expFiltered(); const byC = {};
  exp.forEach(e => { byC[e.category] = (byC[e.category] || 0) + e.amount; });
  const eck = Object.keys(byC).sort((a, b) => byC[b] - byC[a]);
  const ce = document.getElementById('c-expcat');
  if (ce && eck.length) {
    S.charts.expcat = new Chart(ce.getContext('2d'), { type: 'bar',
      data: { labels: eck, datasets: [{ label: 'Expense', data: eck.map(k => byC[k]), backgroundColor: '#a43520', borderRadius: 4 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        scales: { x: { ...axis, beginAtZero: true, ticks: { ...axis.ticks, callback: v => inrShort(v) } }, y: axis },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => inr(c.parsed.x) } } } } });
  } else if (ce) ce.parentElement.innerHTML = '<div class="empty">No expenses in range.</div>';
}

/* ============================================================
   CALENDAR (added 2026-09-28) — opened from the Next up card.

   READ-ONLY by design. "Add booking" is a plain link that opens the admin
   panel's Add Booking form in a new tab, pre-filled through
   admin#add-booking?type=…&venue=…&date=… (see abkApplyPrefill in app.js).
   Pricing (compute_booking_total), the slot/night conflict check, the
   picnic/stay split and the confirmation emails all stay in that one form.
   🔴 Do not call admin_add_manual_booking from this page: a second booking
   form would drift from the admin one, and money/conflict bugs follow.

   Two views, because the two businesses have different shapes:
   - Picnics: month grid; a picnic is one slot on one day at one of many venues.
   - Stays:   one row per unit, bars across nights; a stay is a range of nights.
   Airbnb nights that have NO booking row come from venue_availability
   (source='ical'), with the same two corrections staff_occupancy_upcoming()
   makes: nights already explained by a stay row at that venue (or its combo
   parent) are dropped, and combo venues are skipped because they inherit
   their children. What survives is an Airbnb reservation nobody entered.
   ============================================================ */
const ADMIN_ADD_URL = 'https://www.picnicstories.com/admin#add-booking';
const SLOT_ORDER = { morning: 0, afternoon: 1, evening: 2 };
const SLOT_LBL = { morning: 'Morning', afternoon: 'Afternoon', evening: 'Evening' };
const SLOT_SHORT = { morning: 'Morn', afternoon: 'Aft', evening: 'Eve' };
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DOW_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const CAL_NIGHTS = 28, CAL_PREF_KEY = 'tps.dash.cal';

/* Open/closed and the chosen tab are a per-viewer convenience, so browser
   storage is fine — and optional: a private window just starts closed. */
function calState() {
  if (!S.cal) {
    let p = {};
    try { p = JSON.parse(localStorage.getItem(CAL_PREF_KEY) || '{}') || {}; } catch (e) { p = {}; }
    const t = istTodayIso();
    S.cal = { open: !!p.open, view: p.view === 'stays' ? 'stays' : 'picnic', month: t.slice(0, 7), stayStart: addDaysIso(t, -3), dlg: null, opener: null, focusDlg: false };
  }
  return S.cal;
}
function calSavePrefs() { try { localStorage.setItem(CAL_PREF_KEY, JSON.stringify({ open: S.cal.open, view: S.cal.view })); } catch (e) {} }
function calShortVenue(name) { return String(name || '').replace(/^TerraCottage\s+/i, ''); }
function calSlot(s, short) { return (short ? SLOT_SHORT : SLOT_LBL)[s] || (s ? s : 'No slot'); }
function calHasPicnic(r) { return r.bookingKind ? (r.bookingKind === 'picnic' || r.bookingKind === 'picnic_stay') : r.kind === 'picnic'; }
function calHasStay(r) { return (r.bookingKind ? (r.bookingKind === 'stay' || r.bookingKind === 'picnic_stay') : r.kind === 'stay') && r.date && r.endDate; }
function calAddHref(p) {
  const q = new URLSearchParams();
  Object.keys(p).forEach(k => { if (p[k] != null && p[k] !== '') q.set(k, String(p[k])); });
  return ADMIN_ADD_URL + '?' + q.toString();
}

/* One pass over the loaded data into lookups both views and the dialog share. */
function calIndex() {
  const venues = (S.venues || []).filter(v => v.is_active !== false);
  const vById = new Map((S.venues || []).map(v => [v.id, v]));
  const picByDay = new Map(), stayByVenue = new Map(), nightMap = new Map();
  S.records.forEach(r => {
    if (calHasPicnic(r) && r.date) {
      const k = isoDate(r.date);
      if (!picByDay.has(k)) picByDay.set(k, []);
      picByDay.get(k).push(r);
    }
    if (calHasStay(r)) {
      if (!stayByVenue.has(r.venueId)) stayByVenue.set(r.venueId, []);
      stayByVenue.get(r.venueId).push(r);
      if (!nightMap.has(r.venueId)) nightMap.set(r.venueId, new Map());
      const a = isoDate(r.date), n = nightsBetween(a, isoDate(r.endDate));
      for (let i = 0; i < n; i++) nightMap.get(r.venueId).set(addDaysIso(a, i), r);
    }
  });
  picByDay.forEach(list => list.sort((a, b) => ((SLOT_ORDER[a.slot] ?? 9) - (SLOT_ORDER[b.slot] ?? 9)) || a.venue.localeCompare(b.venue)));
  const children = new Map();
  venues.forEach(v => { if (v.parent_venue_id) { if (!children.has(v.parent_venue_id)) children.set(v.parent_venue_id, []); children.get(v.parent_venue_id).push(v.id); } });
  const bookedOn = (vid, k) => {
    const m = nightMap.get(vid);
    if (m && m.has(k)) return m.get(k);
    const v = vById.get(vid);
    if (v && v.parent_venue_id) { const pm = nightMap.get(v.parent_venue_id); if (pm && pm.has(k)) return pm.get(k); }
    return null;
  };
  const icalOnly = new Map(), adminDay = new Map(), adminSlot = new Map();
  const addTo = (map, key, val) => { if (!map.has(key)) map.set(key, new Set()); map.get(key).add(val); };
  (S.avail || []).forEach(a => {
    const v = vById.get(a.venue_id);
    if (!v) return;
    if (a.source === 'ical') {
      if (v.type === 'combo') return;          // inherits its children — counting it doubles every stay
      if (bookedOn(v.id, a.date)) return;      // already explained by a booking row
      addTo(icalOnly, v.id, a.date);
    } else if (a.source === 'admin') {
      if (a.time_slot) { if (!adminSlot.has(a.date)) adminSlot.set(a.date, []); adminSlot.get(a.date).push({ vid: v.id, slot: a.time_slot }); }
      else addTo(adminDay, v.id, a.date);
    }
  });
  const unitNight = (vid, k) => {
    const r = bookedOn(vid, k);
    if (r) return { t: 'booked', r };
    if (icalOnly.has(vid) && icalOnly.get(vid).has(k)) return { t: 'ical' };
    if (adminDay.has(vid) && adminDay.get(vid).has(k)) return { t: 'blocked' };
    return null;
  };
  const comboFree = (cid, k) => !unitNight(cid, k) && (children.get(cid) || []).every(ch => !unitNight(ch, k));
  const units = venues.filter(v => v.type === 'self_managed').sort((a, b) => a.id - b.id);
  const combos = venues.filter(v => v.type === 'combo' && (children.get(v.id) || []).length).sort((a, b) => a.id - b.id);
  return { venues, vById, picByDay, stayByVenue, children, bookedOn, icalOnly, adminDay, adminSlot, unitNight, comboFree, units, combos };
}

/* Venue+slot groups on one day, measured against venues.max_concurrent_setups.
   Full = at capacity (fine, but take nothing more); over = more setups than
   the venue can hold, which the booking RPCs should have refused. */
function calCapacity(ix, list) {
  const g = new Map();
  list.forEach(r => { const key = r.venueId + '|' + (r.slot || ''); if (!g.has(key)) g.set(key, { r, n: 0 }); g.get(key).n++; });
  const out = [];
  g.forEach(({ r, n }) => {
    const v = ix.vById.get(r.venueId);
    const max = v ? (Number(v.max_concurrent_setups) || 1) : null;
    if (max == null || !r.slot) return;
    if (n > max) out.push({ lvl: 'over', venue: r.venue, slot: r.slot, n, max });
    // Single-setup venues are 'full' with every booking, so only multi-setup
    // venues reaching their cap are worth flagging.
    else if (n === max && max > 1) out.push({ lvl: 'full', venue: r.venue, slot: r.slot, n, max });
  });
  return out;
}

function calPicnicHtml(ix) {
  const c = S.cal, today = istTodayIso();
  const [y, m] = c.month.split('-').map(Number);
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;          // Monday-first grid
  const weeks = Math.ceil((lead + new Date(y, m, 0).getDate()) / 7);
  const first = isoDate(new Date(y, m - 1, 1 - lead));
  const selKey = c.dlg && c.dlg.t === 'day' ? c.dlg.k : '';
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const k = addDaysIso(first, i), d = isoToDate(k);
    const list = ix.picByDay.get(k) || [];
    const cap = calCapacity(ix, list);
    const over = cap.find(x => x.lvl === 'over'), full = cap.find(x => x.lvl === 'full');
    const flag = over ? `<span class="cal-flag over" title="${esc(over.venue)} ${esc(calSlot(over.slot))}: ${over.n} setups, capacity ${over.max}">Over cap</span>`
      : full ? `<span class="cal-flag full" title="${esc(full.venue)} ${esc(calSlot(full.slot))}: ${full.n} of ${full.max} setups">Full</span>` : '';
    const units = ix.units.filter(u => ix.unitNight(u.id, k))
      .map(u => `<span class="cal-unit" title="${esc(u.name)} occupied">${esc(calShortVenue(u.name).charAt(0))}</span>`).join('');
    const blocks = (ix.adminSlot.get(k) || []).map(b => ({ blk: true, venue: (ix.vById.get(b.vid) || {}).name || '', slot: b.slot }))
      .concat(ix.venues.filter(v => v.type === 'cafe' && ix.adminDay.has(v.id) && ix.adminDay.get(v.id).has(k)).map(v => ({ blk: true, venue: v.name, slot: '' })));
    const items = list.map(r => `<div class="cal-chip"><b><span>${esc(r.name || '—')}</span>${r.balance > 0 ? '<i class="cal-due" title="Balance due"></i>' : ''}</b><i>${esc(r.venue)} · ${esc(calSlot(r.slot, true))}${r.bookingKind === 'picnic_stay' ? ' · +stay' : ''}</i></div>`)
      .concat(blocks.map(b => `<div class="cal-chip blk"><b><span>Blocked</span></b><i>${esc(b.venue)}${b.slot ? ' · ' + esc(calSlot(b.slot, true)) : ' · all day'}</i></div>`));
    const shown = items.slice(0, 3).join('') + (items.length > 3 ? `<div class="cal-more">+${items.length - 3} more</div>` : '');
    const aria = `${d.getDate()} ${MON_LBL[d.getMonth()]}: ${list.length ? list.map(r => r.name).join(', ') : 'no picnics'}${full || over ? ', a slot is full' : ''}. Open day`;
    cells += `<button type="button" class="cal-day${monthKey(d) !== c.month ? ' out' : ''}${k === today ? ' today' : ''}${k === selKey ? ' sel' : ''}" data-day="${k}" aria-haspopup="dialog" aria-label="${esc(aria)}">
      <div class="cal-dh"><span class="cal-dh-l"><span class="cal-n">${d.getDate() === 1 ? '1 ' + MON_LBL[d.getMonth()] : d.getDate()}</span>${flag}</span><span class="cal-units">${units}</span></div>
      ${shown}${list.length ? `<span class="cal-count${full || over ? ' full' : ''}">${list.length}</span>` : ''}
    </button>`;
  }
  const unitLegend = ix.units.map(u => `<span class="cal-unit">${esc(calShortVenue(u.name).charAt(0))}</span>`).join('');
  return `<div class="cal-b">
    <div class="cal-dows">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<div>${x}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span><span class="cal-sw" style="background:var(--terracotta-bg)"></span>Picnic: guest, then venue · slot</span>
      <span><span class="cal-flag full">Full</span>Slot at the venue’s setup capacity</span>
      <span><i class="cal-due"></i>Balance due</span>
      ${unitLegend ? `<span>${unitLegend}${esc(ix.units.map(u => calShortVenue(u.name)).join(' / '))} occupied that night</span>` : ''}
      <span class="cal-hint">Click a day for details or to add a booking</span>
    </div>
  </div>`;
}

/* A run of nights [a, b) on the timeline. Geometry puts check-in and check-out
   at the middle of their day columns, so back-to-back stays meet in one cell
   and a turnover day reads as a turnover day. */
function calBarGeom(s0, a, b) {
  // Positions are in columns; --w (the column width, CSS) turns them into px.
  const ci = nightsBetween(s0, a), co = nightsBetween(s0, b);
  const clipL = ci < 0, clipR = co >= CAL_NIGHTS;
  const l = clipL ? 0 : ci + 0.5, r = clipR ? CAL_NIGHTS : co + 0.5;
  return { style: `left:calc(var(--w) * ${l} + ${clipL ? 0 : 1}px); width:calc(var(--w) * ${r - l} - ${(clipL ? 0 : 1) + (clipR ? 0 : 1)}px)`, cls: (clipL ? ' cl' : '') + (clipR ? ' cr' : ''), cells: r - l };
}
/* Consecutive nights in a Set, collapsed into [a, b) runs overlapping the window. */
function calRuns(set, s0, end, test) {
  const out = []; let k = s0;
  if (test ? test(k) : set.has(k)) { while (test ? test(addDaysIso(k, -1)) : set.has(addDaysIso(k, -1))) { k = addDaysIso(k, -1); if (nightsBetween(k, s0) > 120) break; } }
  let runStart = null;
  for (let cur = k; cur < end || runStart; cur = addDaysIso(cur, 1)) {
    const on = test ? test(cur) : set.has(cur);
    if (on && !runStart) runStart = cur;
    if (!on && runStart) { out.push([runStart, cur]); runStart = null; if (cur >= end) break; }
    if (nightsBetween(s0, cur) > CAL_NIGHTS + 120) { if (runStart) out.push([runStart, cur]); break; }
  }
  return out;
}

function calStaysHtml(ix) {
  const c = S.cal, s0 = c.stayStart, end = addDaysIso(s0, CAL_NIGHTS), today = istTodayIso();
  const days = Array.from({ length: CAL_NIGHTS }, (_, i) => addDaysIso(s0, i));
  const shade = days.map((k, i) => { const dw = isoToDate(k).getDay(); return k === today ? `<i class="cal-shade now" style="left:calc(var(--w) * ${i})"></i>` : (dw === 0 || dw === 6) ? `<i class="cal-shade" style="left:calc(var(--w) * ${i})"></i>` : ''; }).join('');
  const head = days.map(k => { const d = isoToDate(k), dw = d.getDay(); return `<div class="cal-tl-col${k === today ? ' now' : d.getDate() === 1 ? ' mo' : (dw === 0 || dw === 6) ? ' wk' : ''}"><small>${DOW_SHORT[dw].charAt(0)}</small>${d.getDate() === 1 ? MON_LBL[d.getMonth()] : d.getDate()}</div>`; }).join('');
  const bar = (a, b, cls, label, data, title) => {
    const g = calBarGeom(s0, a, b);
    return `<button type="button" class="cal-bar ${cls}${g.cls}" style="${g.style}" ${data} aria-haspopup="dialog" title="${esc(title)}" aria-label="${esc(title)}">${g.cells >= 2 ? esc(label) : ''}</button>`;
  };
  const inWin = r => isoDate(r.date) < end && isoDate(r.endDate) > s0;
  const stayBar = (r, prefix) => {
    const a = isoDate(r.date), b = isoDate(r.endDate), n = nightsBetween(a, b);
    const air = r.channel === 'Airbnb';
    return bar(a, b, air ? 'air' : 'dir', `${prefix || ''}${r.name} · ${n}n`, `data-stay="${esc(r.bkid)}"`, `${r.name}, ${air ? 'Airbnb' : 'Direct'} · ${fmtIsoShort(a)} → ${fmtIsoShort(b)} · ${n} night${n === 1 ? '' : 's'}`);
  };
  const rows = [], stats = [], gaps = [];
  const freeRuns = (vid, test) => {
    const from = s0 > today ? s0 : today;
    if (from >= end) return;
    calRuns(null, from, end, k => k >= from && test(k)).forEach(([a, b]) => {
      const open = b >= end;
      gaps.push({ vid, a, b: open ? end : b, open, n: nightsBetween(a, open ? end : b) });
    });
  };
  ix.units.forEach(u => {
    const own = (ix.stayByVenue.get(u.id) || []).filter(inWin).map(r => stayBar(r));
    const par = u.parent_venue_id ? (ix.stayByVenue.get(u.parent_venue_id) || []).filter(inWin).map(r => stayBar(r, calShortVenue((ix.vById.get(u.parent_venue_id) || {}).name) + ': ')) : [];
    const ical = calRuns(ix.icalOnly.get(u.id) || new Set(), s0, end).map(([a, b]) => bar(a, b, 'ical', 'Airbnb block', `data-ical="${u.id}|${a}|${b}"`, `Blocked on Airbnb, no booking entered · ${fmtIsoShort(a)} → ${fmtIsoShort(b)}`));
    const blk = calRuns(ix.adminDay.get(u.id) || new Set(), s0, end).map(([a, b]) => bar(a, b, 'blk', 'Blocked', `data-blk="${u.id}|${a}|${b}"`, `Blocked in admin · ${fmtIsoShort(a)} → ${fmtIsoShort(b)}`));
    rows.push(`<div class="cal-tl-row"><div class="cal-tl-lbl"><b>${esc(calShortVenue(u.name))}</b><span>${esc(u.name === calShortVenue(u.name) ? 'unit' : 'TerraCottage')}</span></div><div class="cal-track" style="width:calc(var(--w) * ${CAL_NIGHTS})">${shade}${own.join('')}${par.join('')}${ical.join('')}${blk.join('')}</div></div>`);
    const booked = days.filter(k => { const s = ix.unitNight(u.id, k); return s && s.t !== 'blocked'; }).length;
    stats.push({ name: calShortVenue(u.name), booked });
    freeRuns(u.id, k => !ix.unitNight(u.id, k));
  });
  ix.combos.forEach(cv => {
    const own = (ix.stayByVenue.get(cv.id) || []).filter(inWin).map(r => stayBar(r));
    const sellFrom = s0 > today ? s0 : today;   // past nights are not sellable
    const sell = calRuns(null, sellFrom, end, k => k >= sellFrom && ix.comboFree(cv.id, k)).map(([a, b]) => {
      const open = b >= end, bb = open ? end : b, n = nightsBetween(a, bb);
      return bar(a, bb, 'sell', `Sellable · ${n}${open ? '+' : ''}n`, `data-gap="${cv.id}|${a}|${bb}|${open ? 1 : 0}"`, `${cv.name} sellable (all units free) · ${fmtIsoShort(a)} → ${open ? 'beyond ' + fmtIsoShort(bb) : fmtIsoShort(bb)}`);
    });
    rows.push(`<div class="cal-tl-row"><div class="cal-tl-lbl"><b>${esc(calShortVenue(cv.name))}</b><span>whole home · derived</span></div><div class="cal-track combo" style="width:calc(var(--w) * ${CAL_NIGHTS})">${own.join('')}${sell.join('')}</div></div>`);
    freeRuns(cv.id, k => ix.comboFree(cv.id, k));
  });
  /* partner_bnb and any other venue that actually has a stay in view gets a row
     too, so nothing booked is invisible just because it isn't a TerraCottage unit. */
  const shownIds = new Set(ix.units.map(u => u.id).concat(ix.combos.map(v => v.id)));
  ix.stayByVenue.forEach((list, vid) => {
    if (shownIds.has(vid)) return;
    const inView = list.filter(inWin);
    if (!inView.length) return;
    const v = ix.vById.get(vid) || { name: inView[0].venue };
    rows.push(`<div class="cal-tl-row"><div class="cal-tl-lbl"><b>${esc(v.name)}</b><span>${esc(v.type || 'stay')}</span></div><div class="cal-track" style="width:calc(var(--w) * ${CAL_NIGHTS})">${shade}${inView.map(r => stayBar(r)).join('')}</div></div>`);
  });
  gaps.sort((a, b) => a.a.localeCompare(b.a) || a.vid - b.vid);
  const gapHtml = gaps.slice(0, 10).map(g => `<button type="button" class="cal-gap" data-gap="${g.vid}|${g.a}|${g.b}|${g.open ? 1 : 0}" aria-haspopup="dialog"><span><b>${esc(calShortVenue((ix.vById.get(g.vid) || {}).name))}</b> · ${fmtIsoShort(g.a)}${g.open ? ' →' : ' – ' + fmtIsoShort(g.b)}</span><span>${g.n}${g.open ? '+' : ''} night${g.n === 1 && !g.open ? '' : 's'}</span></button>`).join('');
  const statHtml = stats.map(s => { const pct = Math.round(s.booked / CAL_NIGHTS * 100); return `<div class="cal-occ"><div><span><b>${esc(s.name)}</b></span><span>${s.booked} / ${CAL_NIGHTS} · ${pct}%</span></div><div class="occ-bar" style="margin-top:4px"><i style="width:${pct}%;background:var(--terracotta)"></i></div></div>`; }).join('');
  return `<div class="cal-stays">
    <div class="cal-tl-wrap"><div class="cal-tl">
      <div class="cal-tl-row hd"><div class="cal-tl-lbl"></div><div class="cal-tl-cols">${head}</div></div>
      ${rows.join('') || '<div class="empty">No stay venues found.</div>'}
      <div class="cal-legend">
        <span><span class="cal-sw" style="background:var(--terracotta)"></span>Airbnb</span>
        <span><span class="cal-sw" style="background:var(--olive)"></span>Direct</span>
        <span><span class="cal-sw" style="background:repeating-linear-gradient(135deg,#f3d9cb 0 4px,#fbeee5 4px 8px);box-shadow:inset 0 0 0 1px var(--terracotta)"></span>Blocked on Airbnb, no booking entered</span>
        <span><span class="cal-sw" style="background:var(--olive-bg);border:1.5px dashed var(--olive)"></span>Whole home sellable</span>
      </div>
    </div></div>
    <aside class="cal-side">
      <div><h4>Nights taken · these ${CAL_NIGHTS}</h4>${statHtml || '<div class="empty">—</div>'}</div>
      <div><h4>Open nights · click to book</h4>${gapHtml || '<div class="cal-dlg-s">Nothing open from today in this window.</div>'}</div>
    </aside>
  </div>`;
}
function fmtIsoShort(k) { return fmtShort(isoToDate(k)); }

function calMoneyHtml(r) {
  const air = r.channel === 'Airbnb';
  const due = r.balance > 0;
  return `<div class="cal-bk-m">
    <div>Total<b>${inr(r.total)}</b></div>
    <div>${r.paid ? 'Paid' : 'Advance'}<b>${inr(r.collected)}</b></div>
    <div>${air ? 'Awaiting payout' : 'Balance'}<b class="${due ? 'due' : 'ok'}">${due ? inr(r.balance) : 'Settled'}</b></div>
  </div>`;
}
function calBookingCard(r, forStay) {
  const chan = r.channel === 'Airbnb' ? '<span class="badge b-airbnb">Airbnb</span>' : r.channel === 'Website' ? '<span class="badge b-live">Website</span>' : '<span class="badge b-plain">Direct</span>';
  let line;
  if (forStay) {
    const a = isoDate(r.date), b = isoDate(r.endDate), n = nightsBetween(a, b);
    line = [r.venue, `${fmtIsoShort(a)} → ${fmtIsoShort(b)}`, `${n} night${n === 1 ? '' : 's'}`, r.guests ? `${r.guests} guest${r.guests === 1 ? '' : 's'}` : ''];
  } else {
    line = [r.venue, calSlot(r.slot), r.pkg, r.guests ? `${r.guests} guest${r.guests === 1 ? '' : 's'}` : '', r.occasion, r.bookingKind === 'picnic_stay' ? 'with a stay' : ''];
  }
  return `<div class="cal-bk">
    <div class="cal-bk-t"><b>${esc(r.name || '—')}</b><span>${chan}${esc(r.bookingId)}</span></div>
    <div class="cal-bk-l">${esc(line.filter(Boolean).join(' · '))}</div>
    ${calMoneyHtml(r)}
  </div>`;
}

/* Dialog content, resolved from S.cal.dlg on every render so a refresh (e.g.
   coming back from the admin tab) shows the booking that was just added. */
function calDialogHtml(ix) {
  const d = S.cal.dlg;
  if (!d) return '';
  const today = istTodayIso();
  let kicker = '', title = '', sub = '', body = '', add = null, hint = '';
  if (d.t === 'day') {
    const dt = isoToDate(d.k), list = ix.picByDay.get(d.k) || [];
    const past = d.k < today;
    const due = list.reduce((s, r) => s + (r.balance > 0 ? r.balance : 0), 0);
    kicker = past ? 'Past day' : d.k === today ? 'Today' : 'Picnics';
    title = `${DOW_LONG[dt.getDay()]}, ${dt.getDate()} ${MON_LBL[dt.getMonth()]}`;
    sub = list.length ? `${list.length} picnic setup${list.length === 1 ? '' : 's'}${due ? ' · ' + inr(due) + ' still to collect' : ''}` : 'No picnics booked';
    body = list.map(r => calBookingCard(r, false)).join('') || '<div class="cal-note plain">Nothing booked on this day yet.</div>';
    calCapacity(ix, list).forEach(x => {
      body += x.lvl === 'over'
        ? `<div class="cal-note red">${esc(x.venue)} ${esc(calSlot(x.slot).toLowerCase())}: ${x.n} setups against a capacity of ${x.max}. Check this booking before the day.</div>`
        : `<div class="cal-note amber">${esc(x.venue)} ${esc(calSlot(x.slot).toLowerCase())} is full (${x.n} of ${x.max} setups).</div>`;
    });
    const blocks = (ix.adminSlot.get(d.k) || []).map(b => `${(ix.vById.get(b.vid) || {}).name || 'Venue'} ${calSlot(b.slot).toLowerCase()}`);
    if (blocks.length) body += `<div class="cal-also"><b>Blocked</b>${esc(blocks.join(' · '))}</div>`;
    const stays = ix.units.map(u => { const s = ix.unitNight(u.id, d.k); if (!s) return ''; return `${calShortVenue(u.name)}: ${s.t === 'booked' ? s.r.name + (s.r.channel === 'Airbnb' ? ' (Airbnb)' : '') : s.t === 'ical' ? 'Airbnb block' : 'blocked'}`; }).filter(Boolean);
    if (stays.length) body += `<div class="cal-also"><b>Stays that night</b>${esc(stays.join(' · '))}</div>`;
    if (!past) { add = { type: 'picnic', date: d.k }; hint = `Opens Add Booking in a new tab with ${dt.getDate()} ${MON_LBL[dt.getMonth()]} filled in. Pick the venue and slot there; its slot check runs on save.`; }
    else hint = 'Past date. Back-fill from the admin panel directly; the sheet sync can duplicate rows dated in its lookback window.';
  } else if (d.t === 'stay') {
    const r = S.records.find(x => x.bkid === d.id);
    if (!r) { S.cal.dlg = null; return ''; }
    const a = isoDate(r.date), b = isoDate(r.endDate);
    kicker = r.venue; title = r.name || '—';
    sub = `${fmtIsoShort(a)} → ${fmtIsoShort(b)}${a <= today && b > today ? ' · in house now' : b <= today ? ' · checked out' : ''}`;
    body = calBookingCard(r, true);
    if (r.bookingKind === 'picnic_stay') body += '<div class="cal-also"><b>Also</b>includes a picnic setup</div>';
    if (b >= today) { add = { type: 'stay', venue: r.venueId, checkin: b }; hint = `Opens Add Booking for ${r.venue} with check-in ${fmtIsoShort(b)}, this guest’s check-out.`; }
  } else if (d.t === 'gap' || d.t === 'ical' || d.t === 'blk') {
    const v = ix.vById.get(d.vid) || { name: 'Venue' };
    const n = nightsBetween(d.a, d.b);
    const from = d.a < today ? today : d.a;
    const range = `${fmtIsoShort(d.a)} → ${d.open ? 'beyond ' + fmtIsoShort(d.b) : fmtIsoShort(d.b)} · ${n}${d.open ? '+' : ''} night${n === 1 && !d.open ? '' : 's'}`;
    if (d.t === 'gap') {
      kicker = 'Open nights'; title = `${v.name} is free`; sub = range;
      body = v.type === 'combo'
        ? `<div class="cal-note plain">Every unit is free on these nights, so the whole home can be sold. A ${esc(v.name)} booking blocks all of its units.</div>`
        : '<div class="cal-note plain">No booking or block on these nights.</div>';
    } else if (d.t === 'ical') {
      kicker = 'Blocked on Airbnb'; title = `${v.name}: no booking entered`; sub = range;
      body = '<div class="cal-note amber">Airbnb shows these nights as taken, but there is no booking row for them. If it is a real reservation, enter it (source: Airbnb) so revenue and occupancy count it. If it is a block you set on Airbnb, nothing to do.</div>';
    } else {
      kicker = 'Blocked'; title = `${v.name} is blocked`; sub = range;
      body = '<div class="cal-note plain">Blocked in the admin panel’s Availability tab. Unblock it there before adding a booking.</div>';
    }
    if (d.t !== 'blk' && from < d.b) {
      add = { type: 'stay', venue: v.id, checkin: from, checkout: d.open ? '' : d.b };
      hint = `Opens Add Booking with ${v.name}, check-in ${fmtIsoShort(from)}${d.open ? '' : ', check-out ' + fmtIsoShort(d.b)}.`;
    }
  }
  return `<div class="cal-ov" data-cal-ov>
    <div class="cal-dlg" role="dialog" aria-modal="true" aria-labelledby="cal-dlg-t" tabindex="-1">
      <div class="cal-dlg-h">
        <div><div class="cal-dlg-k">${esc(kicker)}</div><h2 id="cal-dlg-t">${esc(title)}</h2><div class="cal-dlg-s">${esc(sub)}</div></div>
        <button type="button" class="cal-x" data-cal-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="cal-dlg-b">${body}</div>
      <div class="cal-dlg-f">
        <p>${esc(hint)}</p>
        <div>
          <button type="button" class="btn" data-cal-close>Close</button>
          ${add ? `<a class="cal-add" href="${esc(calAddHref(add))}" target="_blank" rel="noopener" data-cal-add><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add booking</a>` : '<span class="cal-add off" aria-disabled="true">Add booking</span>'}
        </div>
      </div>
    </div>
  </div>`;
}

function renderCalendar() {
  const mount = document.getElementById('cal');
  if (!mount) return;
  const c = calState();
  const lb = document.getElementById('cal-t-list'), cb = document.getElementById('cal-t-cal');
  if (lb) lb.setAttribute('aria-pressed', String(!c.open));
  if (cb) cb.setAttribute('aria-pressed', String(c.open));
  if (!c.open) { mount.innerHTML = ''; return; }
  const ix = calIndex();
  const nPic = S.records.filter(r => calHasPicnic(r) && r.date && isoDate(r.date) >= istTodayIso()).length;
  const nStay = S.records.filter(r => calHasStay(r) && isoDate(r.endDate) > istTodayIso()).length;
  const isPic = c.view === 'picnic';
  const [y, m] = c.month.split('-').map(Number);
  const period = isPic ? `${MON_LBL[m - 1]} ${y}` : `${fmtIsoShort(c.stayStart)} – ${fmtIsoShort(addDaysIso(c.stayStart, CAL_NIGHTS - 1))}`;
  mount.innerHTML = `<section class="cal" aria-label="Bookings calendar">
    <div class="cal-h">
      <div class="cal-h-l">
        <h2>Calendar</h2>
        <div class="cal-tabs" role="tablist" aria-label="Booking type">
          <button type="button" class="cal-tab" role="tab" aria-selected="${isPic}" data-cal-view="picnic">Picnics <small>· ${nPic} ahead</small></button>
          <button type="button" class="cal-tab" role="tab" aria-selected="${!isPic}" data-cal-view="stays">Airbnb &amp; stays <small>· ${nStay} ahead</small></button>
        </div>
      </div>
      <div class="cal-h-r">
        <button type="button" class="btn cal-nav" data-cal-step="-1" aria-label="${isPic ? 'Previous month' : 'Previous four weeks'}">‹</button>
        <div class="cal-period" aria-live="polite">${esc(period)}</div>
        <button type="button" class="btn cal-nav" data-cal-step="1" aria-label="${isPic ? 'Next month' : 'Next four weeks'}">›</button>
        <button type="button" class="btn" data-cal-today>Today</button>
      </div>
    </div>
    ${S.calDataErr ? `<div class="cal-warn">${esc(S.calDataErr)}</div>` : ''}
    ${isPic ? calPicnicHtml(ix) : calStaysHtml(ix)}
    ${calDialogHtml(ix)}
  </section>`;
  if (!mount._calBound) { mount.addEventListener('click', calClick); mount.addEventListener('keydown', calKeydown); mount._calBound = true; }
  if (c.dlg && c.focusDlg) {
    c.focusDlg = false;
    const x = mount.querySelector('.cal-dlg [data-cal-close]');
    if (x) x.focus();
  }
}

function calOpenDlg(dlg, opener) {
  S.cal.dlg = dlg; S.cal.opener = opener; S.cal.focusDlg = true;
  renderCalendar();
}
function calCloseDlg() {
  const op = S.cal.opener;
  S.cal.dlg = null; S.cal.opener = null;
  renderCalendar();
  if (op) { const el = document.querySelector(op); if (el) el.focus(); }
}
function calClick(e) {
  const t = e.target;
  const c = S.cal;
  if (t.closest('[data-cal-add]')) { S.calPendingRefresh = true; return; }   // let the link open its new tab
  if (t.closest('[data-cal-close]') || t.hasAttribute('data-cal-ov')) { calCloseDlg(); return; }
  if (t.closest('.cal-dlg')) return;
  let el;
  if ((el = t.closest('[data-cal-view]'))) { c.view = el.dataset.calView; c.dlg = null; calSavePrefs(); renderCalendar(); return; }
  if ((el = t.closest('[data-cal-step]'))) {
    const step = Number(el.dataset.calStep);
    if (c.view === 'picnic') { const [y, m] = c.month.split('-').map(Number); c.month = monthKey(new Date(y, m - 1 + step, 1)); }
    else c.stayStart = addDaysIso(c.stayStart, step * 28);
    renderCalendar(); return;
  }
  if (t.closest('[data-cal-today]')) { const td = istTodayIso(); c.month = td.slice(0, 7); c.stayStart = addDaysIso(td, -3); renderCalendar(); return; }
  if ((el = t.closest('[data-day]'))) { calOpenDlg({ t: 'day', k: el.dataset.day }, `[data-day="${el.dataset.day}"]`); return; }
  if ((el = t.closest('[data-stay]'))) { calOpenDlg({ t: 'stay', id: el.dataset.stay }, `[data-stay="${el.dataset.stay}"]`); return; }
  for (const kind of ['gap', 'ical', 'blk']) {
    if ((el = t.closest(`[data-${kind}]`))) {
      const [vid, a, b, open] = el.dataset[kind].split('|');
      calOpenDlg({ t: kind, vid: Number(vid), a, b, open: open === '1' }, `[data-${kind}="${el.dataset[kind]}"]`);
      return;
    }
  }
}
function calKeydown(e) {
  if (!S.cal || !S.cal.dlg) return;
  if (e.key === 'Escape') { e.preventDefault(); calCloseDlg(); return; }
  if (e.key === 'Tab') {   // keep focus inside the open dialog
    const f = Array.from(document.querySelectorAll('.cal-dlg button, .cal-dlg a[href]'));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}
window.calSetOpen = function (on) {
  const c = calState();
  c.open = !!on; if (!on) c.dlg = null;
  calSavePrefs();
  renderCalendar();
  if (on) { const el = document.getElementById('cal'); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
};
/* Coming back to this tab after "Add booking" re-reads the data, so the new
   booking shows without pressing Refresh. Also refreshes a page left open for
   over 10 minutes. refresh() keeps filters, scroll and the open dialog. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.dbOk) return;
  if (S.calPendingRefresh || Date.now() - (S.loadedAt || 0) > 10 * 60 * 1000) { S.calPendingRefresh = false; window.refresh(); }
});

/* ---------- auth gate ----------
   This is a front door, not a lock. The lock is RLS on the database: signing in
   as anyone other than the admin returns zero rows, and not signing in at all
   returns zero rows. The gate exists so the page says "sign in" instead of
   showing an empty dashboard, and so supabase-js has a session to attach. */
function signInScreen(message) {
  document.getElementById('root').innerHTML = `
    <div class="signin-wrap">
      <div class="signin-card">
        <div class="signin-brand">The Picnic Stories</div>
        <h1>Business dashboard</h1>
        <p class="signin-sub">Gurugram &amp; Delhi</p>
        <form id="signin-form" autocomplete="on">
          <label for="si-email">Email</label>
          <input id="si-email" type="email" autocomplete="username" required />
          <label for="si-pass">Password</label>
          <input id="si-pass" type="password" autocomplete="current-password" required />
          <button type="submit" id="si-go">Sign in</button>
        </form>
        <div id="si-msg" class="signin-msg">${message ? esc(message) : ''}</div>
      </div>
    </div>`;
  const form = document.getElementById('signin-form');
  const msg = document.getElementById('si-msg');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = document.getElementById('si-go');
    btn.disabled = true; btn.textContent = 'Signing in…'; msg.textContent = '';
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('si-email').value.trim(),
      password: document.getElementById('si-pass').value,
    });
    if (error) {
      btn.disabled = false; btn.textContent = 'Sign in';
      msg.textContent = error.message || 'Sign-in failed.';
      return;
    }
    boot();
  });
}

async function signOut() {
  await sb.auth.signOut();
  location.reload();
}

/* Re-read the data without throwing away what the user is looking at. load()
   defaults the period to the latest month with bookings, which is right on first
   open and wrong on a refresh — so the current filters are restored afterwards. */
window.refresh = async function () {
  const keep = { ...S.filters }, keepDetail = S.detail, keepOwed = S.owedOpen;
  const keepY = window.scrollY;   // a background refresh (tab return) must not jump the page
  try {
    await load();
    S.filters = keep; S.detail = keepDetail; S.owedOpen = keepOwed;
    render();
    window.scrollTo(0, keepY);
  } catch (err) {
    document.getElementById('root').innerHTML = `<div class="state err"><strong>Couldn’t refresh.</strong><div>${esc(err.message || String(err))}</div></div>`;
  }
};

/* ---------- boot ---------- */
/* The database decides what anyone can READ; this list only decides who gets
   shown a dashboard. They must agree — it mirrors the RLS policies, which grant
   read to auth.email() = 'aksh.eeev@gmail.com' and nobody else.
   🔴 Without this check a signed-in CUSTOMER lands on a working-looking
   dashboard built from their own bookings: customer_select_own_bookings lets
   them read their rows, and booking_costs/expenses return [] rather than an
   error, so nothing else here would catch it. Not a leak — it is their own
   data — but it would look like the business dashboard, and it isn't.
   Widening this list alone does NOT grant a partner access; the RLS policies
   have to change too, or they will sign in and see zero rows. */
const ALLOWED = ['aksh.eeev@gmail.com'];

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { signInScreen(''); return; }
  S.email = (session.user && session.user.email) || '';
  if (!ALLOWED.includes(S.email.trim().toLowerCase())) {
    await sb.auth.signOut();
    signInScreen('That account does not have access to this dashboard.');
    return;
  }
  document.getElementById('root').innerHTML = '<div class="state">Loading…</div>';
  try {
    await load();
    render();
  } catch (err) {
    const m = err && err.message ? err.message : String(err);
    /* A signed-in account with no read access is a wrong-account problem, not a
       broken dashboard — send them back to the door rather than to an error. */
    if (/does not have read access/i.test(m)) {
      await sb.auth.signOut();
      signInScreen('That account cannot see the business data. Sign in with the owner account.');
      return;
    }
    document.getElementById('root').innerHTML = `<div class="state err"><strong>Couldn’t load the dashboard.</strong><div>${esc(m)}</div><div style="margin-top:9px; font-size:12px;">Reload the page to retry, or <a href="#" onclick="signOut();return false;">sign out</a>.</div></div>`;
  }
}
boot();
</script>
