<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>The Picnic Stories — Business Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f8f4ee;
    --bg-2: #f1ebe2;
    --card: #ffffff;
    --ink: #2a2521;
    --ink-2: #4f463d;
    --muted: #6b6259;
    --hair: #e6ddd1;
    --hair-2: #efe8de;
    --terracotta: #b8552a;
    --terracotta-2: #d8794f;
    --terracotta-bg: #fbeee5;
    --olive: #5c6b42;
    --olive-bg: #e9eedd;
    --amber: #8f6512;
    --amber-bg: #fbf0d3;
    --red: #a43520;
    --red-bg: #fbe7e2;
    --blue: #385a7a;
    --blue-bg: #e5eef5;
    --serif: Georgia, "Times New Roman", "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --r: 14px;
    --r-sm: 9px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 22px 64px; }

  /* ---------- masthead ---------- */
  .mast { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 22px; margin-bottom: 18px; }
  .brand h1 { font-family: var(--serif); font-size: 28px; font-weight: 400; margin: 0; letter-spacing: -.01em; color: var(--ink); }
  .brand h1 em { font-style: italic; color: var(--terracotta); }
  .brand .scope { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .mast-ctl { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .ctl { display: flex; flex-direction: column; gap: 4px; }
  .ctl label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  select, input[type="search"] {
    font: inherit; font-size: 13px; padding: 7px 10px; min-height: 36px;
    border: 1px solid var(--hair); border-radius: var(--r-sm); background: var(--card); color: var(--ink); min-width: 128px;
  }
  select:focus, input:focus, button:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 1px; }
  #f-basis { border-color: var(--terracotta); color: var(--terracotta); font-weight: 600; }
  .btn { font: inherit; font-size: 13px; padding: 8px 13px; min-height: 36px; border: 1px solid var(--hair); border-radius: var(--r-sm); background: var(--card); color: var(--ink-2); cursor: pointer; }
  .btn:hover { border-color: var(--terracotta); color: var(--terracotta); }
  .btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .stamp { width: 100%; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .stamp span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--olive); }
  .dot.bad { background: var(--red); }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: repeat(3, 1fr) 1.25fr; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 980px) { .hero { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .hero { grid-template-columns: 1fr; } }
  .hcard { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r); padding: 18px 20px 16px; display: flex; flex-direction: column; min-height: 178px; }
  .hcard.accent { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }
  .hcard .l { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
  .hcard.accent .l { color: rgba(255,255,255,.82); }
  .hcard .v { font-family: var(--serif); font-size: 38px; line-height: 1.05; margin: 8px 0 6px; letter-spacing: -.015em; color: var(--ink); }
  .hcard.accent .v { color: #fff; }
  .hcard .s { font-size: 12.5px; color: var(--muted); }
  .hcard.accent .s { color: rgba(255,255,255,.85); }
  .hcard .foot { margin-top: auto; padding-top: 10px; font-size: 12.5px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; vertical-align: middle; }
  .chip.up { background: var(--olive-bg); color: var(--olive); }
  .chip.down { background: var(--red-bg); color: var(--red); }
  .chip.flat { background: var(--bg-2); color: var(--muted); }
  .hcard.accent .chip.up { background: rgba(255,255,255,.18); color: #fff; }
  .hcard.accent .chip.down { background: rgba(0,0,0,.18); color: #fff; }
  .hcard.accent .chip.flat { background: rgba(255,255,255,.14); color: #fff; }
  .debt { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12.5px; }
  .debt li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px solid var(--hair-2); }
  .debt li span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .hcard.accent .debt li { border-top-color: rgba(255,255,255,.22); }
  .hcard[role="button"] { cursor: pointer; transition: background .12s, box-shadow .12s; }
  .hcard.accent[role="button"]:hover { background: #a94c25; }
  .hcard.accent.on { box-shadow: 0 0 0 3px rgba(184,85,42,.4); }
  .hcard[role="button"]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .cue { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 5px; }

  .next { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r); padding: 16px 18px 12px; }
  .next h3 { font-family: var(--serif); font-weight: 400; font-size: 19px; margin: 0 0 8px; }
  .next h3 small { font-family: var(--sans); font-size: 12px; color: var(--muted); margin-left: 8px; }
  .nrow { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--hair-2); font-size: 13px; }
  .nrow:first-of-type { border-top: none; }
  .nrow .d { font-family: var(--serif); font-size: 15px; line-height: 1.1; }
  .nrow .d small { display: block; font-family: var(--sans); font-size: 11.5px; color: var(--muted); }
  .nrow .who { min-width: 0; }
  .nrow .who b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nrow .who span { color: var(--muted); font-size: 12px; }
  .nrow .amt { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .nrow .amt b { display: block; color: var(--amber); }
  .nrow .amt i { font-style: normal; color: var(--muted); }
  .flag { background: var(--red-bg); border-radius: 6px; }
  .empty { padding: 22px 12px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---------- sections ---------- */
  .sec { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
  .sec h2 { font-family: var(--serif); font-weight: 400; font-size: 21px; margin: 0; }
  .sec .hint { font-size: 12.5px; color: var(--muted); }
  .sec .right { margin-left: auto; font-size: 12.5px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r); margin-bottom: 14px; }
  .card-h { padding: 14px 18px 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-h h3 { font-size: 14px; margin: 0; font-weight: 600; }
  .card-h p { font-size: 12.5px; color: var(--muted); margin: 0; }
  .card-b { padding: 12px 18px 16px; }
  .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .chart-box { position: relative; height: 300px; }
  .chart-box.sm { height: 260px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .kpi { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-sm); padding: 12px 14px; transition: border-color .12s; }
  .kpi .l { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .kpi .v { font-size: 21px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .kpi.click { cursor: pointer; }
  .kpi.click:hover { border-color: var(--terracotta); }
  .kpi.click .l::after { content: "›"; margin-left: 5px; opacity: .4; }
  .kpi.on { border-color: var(--terracotta); background: var(--terracotta-bg); }
  .kpi.on .l { color: var(--terracotta); }
  .kpi.on .l::after { content: "✕"; opacity: .75; font-size: 10px; }
  .kpi.red .v { color: var(--red); } .kpi.olive .v { color: var(--olive); } .kpi.amber .v { color: var(--amber); }
  .occ-row { padding: 20px 2px; border-bottom: 1px solid var(--hair); }
  .occ-row:first-child { padding-top: 6px; }
  .occ-row:last-child { border-bottom: none; padding-bottom: 8px; }
  .occ-row .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .occ-row .name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .occ-row .pct { display: flex; align-items: baseline; gap: 9px; }
  .occ-row .pct b { font-size: 28px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .occ-bar { height: 6px; border-radius: 3px; background: var(--bg-2); overflow: hidden; }
  .occ-bar > i { display: block; height: 100%; border-radius: 3px; transition: width .25s ease; }
  .occ-row .s { font-size: 12.5px; color: var(--muted); margin-top: 9px; }
  .occ-row .occ-adr { margin-top: 3px; }
  .occ-row .occ-adr b { color: var(--ink, inherit); font-weight: 600; font-variant-numeric: tabular-nums; }
  .occ-note { font-size: 12px; color: var(--muted); margin: 14px 2px 4px; text-align: right; }
  .occ-empty { padding: 30px 4px; }

  /* ---------- data health strip ---------- */
  .health { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r-sm); font-size: 13px; margin-bottom: 14px; border: 1px solid; }
  .health.ok { background: var(--olive-bg); border-color: #d6dfc0; color: var(--olive); }
  .health.warn { background: var(--amber-bg); border-color: #efd9a3; color: var(--amber); }
  .health b { font-weight: 600; }
  .health .btn { margin-left: auto; min-height: 30px; padding: 5px 10px; font-size: 12px; }
  .alert { border-radius: var(--r-sm); padding: 12px 14px; margin-bottom: 10px; border: 1px solid; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
  .alert.warn { background: var(--red-bg); border-color: #efc9c0; }
  .alert.info { background: var(--blue-bg); border-color: #cddbe8; }
  .alert h4 { margin: 0 0 3px; font-size: 13.5px; }
  .alert.warn h4 { color: var(--red); } .alert.info h4 { color: var(--blue); }
  .alert p { margin: 0; color: var(--ink-2); }
  .alert ul { margin: 6px 0 0; padding-left: 17px; color: var(--ink-2); }

  /* ---------- filters disclosure ---------- */
  details.filters { margin-bottom: 14px; }
  details.filters summary { cursor: pointer; font-size: 13px; color: var(--ink-2); padding: 8px 0; list-style: none; display: inline-flex; gap: 8px; align-items: center; }
  details.filters summary::-webkit-details-marker { display: none; }
  details.filters summary::before { content: "▸"; color: var(--muted); }
  details.filters[open] summary::before { content: "▾"; }
  .fbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding: 10px 0 4px; }

  /* ---------- tables ---------- */
  .tscroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 10px 11px; white-space: nowrap; border-bottom: 1.5px solid var(--hair); color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--terracotta); }
  thead th .ar { font-size: 9px; margin-left: 3px; }
  tbody td { padding: 9px 11px; border-bottom: 1px solid var(--hair-2); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fbf8f3; }
  tbody tr.flagged { background: #fdf3ef; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .strong { font-weight: 600; }
  .split { font-size: 11.5px; color: var(--blue); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .b-paid { background: var(--olive-bg); color: var(--olive); }
  .b-pending { background: var(--amber-bg); color: var(--amber); }
  .b-plain { background: var(--bg-2); color: var(--muted); }
  .b-live { background: var(--olive-bg); color: var(--olive); }
  .b-sheet { background: var(--red-bg); color: var(--red); }
  .b-airbnb { background: var(--blue-bg); color: var(--blue); }
  .b-picnic { background: var(--terracotta-bg); color: var(--terracotta); }
  .b-stay { background: var(--blue-bg); color: var(--blue); }

  /* ---------- P&L ---------- */
  .pnl { width: 100%; }
  .pnl td { padding: 8px 6px; font-size: 13.5px; }
  .pnl td:first-child { color: var(--ink-2); }
  .pnl tr.total td { border-top: 2px solid var(--hair); font-family: var(--serif); font-size: 18px; padding-top: 10px; }
  .note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; line-height: 1.55; }

  .foot { font-size: 12px; color: var(--muted); line-height: 1.65; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--hair); }
  .foot code { background: var(--bg-2); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
  /* ---- sign-in ---- */
  .signin-wrap { min-height: 76vh; display: flex; align-items: center; justify-content: center; padding: 24px 0; }
  .signin-card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r); padding: 34px 30px 26px; width: 100%; max-width: 380px; box-shadow: 0 1px 2px rgba(42,37,33,.04), 0 8px 28px rgba(42,37,33,.06); }
  .signin-brand { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--terracotta); font-weight: 600; }
  .signin-card h1 { font-size: 22px; margin: 10px 0 2px; color: var(--ink); letter-spacing: -.01em; }
  .signin-sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  .signin-card label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 0 0 5px; }
  .signin-card input { width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--hair); border-radius: 9px; margin-bottom: 14px; }
  .signin-card input:focus { outline: 2px solid var(--terracotta); outline-offset: 1px; border-color: transparent; }
  .signin-card button { width: 100%; padding: 11px 14px; font: inherit; font-size: 14px; font-weight: 600; color: #fff;
    background: var(--terracotta); border: 0; border-radius: 9px; cursor: pointer; margin-top: 4px; }
  .signin-card button:disabled { opacity: .6; cursor: default; }
  .signin-msg { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: var(--red); text-align: center; }
  .stamp .who a { color: var(--terracotta); text-decoration: none; }
  .stamp .who a:hover { text-decoration: underline; }

  .state { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r); padding: 32px; text-align: center; color: var(--muted); }
  .state.err { text-align: left; border-color: #efc9c0; background: var(--red-bg); color: var(--ink-2); }
  .state.err strong { color: var(--red); display: block; margin-bottom: 5px; font-size: 14px; }
  /* ---------- calendar (added 2026-09-28) ---------- */
  .next-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .next-h h3 { margin: 0; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--bg-2); border-radius: var(--r-sm); flex-shrink: 0; }
  .seg button { font: inherit; font-size: 12.5px; font-weight: 600; border: 0; border-radius: 7px; padding: 5px 10px; min-height: 30px; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(42,37,33,.12); }
  .cal { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r); margin-bottom: 16px; overflow: hidden; }
  .cal-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--hair-2); }
  .cal-h-l, .cal-h-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cal-h h2 { font-family: var(--serif); font-weight: 400; font-size: 21px; margin: 0; }
  .cal-tabs { display: flex; gap: 4px; }
  .cal-tab { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--hair); border-radius: 20px; padding: 5px 13px; min-height: 34px; background: var(--card); color: var(--ink-2); cursor: pointer; }
  .cal-tab[aria-selected="true"] { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }
  .cal-tab small { font-size: 12px; font-weight: 500; opacity: .8; }
  .cal-nav { width: 36px; padding: 0; font-size: 16px; }
  .cal-period { font-family: var(--serif); font-size: 16px; min-width: 150px; text-align: center; }
  .cal-b { padding: 12px 16px 14px; }
  .cal-warn { margin: 10px 16px 0; font-size: 12.5px; color: var(--amber); background: var(--amber-bg); border-radius: var(--r-sm); padding: 8px 12px; }
  .cal-dows, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .cal-dows { margin-bottom: 5px; }
  .cal-dows div { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--muted); padding-left: 4px; }
  .cal-day { font: inherit; text-align: left; min-height: 112px; padding: 6px 6px 7px; border: 1px solid var(--hair-2); border-radius: var(--r-sm); background: var(--card); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cal-day:hover { border-color: var(--terracotta-2); }
  .cal-day.out { background: var(--bg); }
  .cal-day.out .cal-n { color: #8a8077; }
  .cal-day.sel { border: 2px solid var(--terracotta); padding: 5px 5px 6px; }
  .cal-dh { display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 20px; }
  .cal-dh-l { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .cal-n { font-size: 13px; font-weight: 500; }
  .cal-day.today .cal-n { background: var(--ink); color: #fff; border-radius: 10px; padding: 0 7px; font-weight: 700; }
  .cal-flag { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 0 5px; white-space: nowrap; }
  .cal-flag.full { background: var(--amber-bg); color: #6f4d0b; }
  .cal-flag.over { background: var(--red-bg); color: var(--red); }
  .cal-units { display: flex; gap: 3px; flex-shrink: 0; }
  .cal-unit { font-size: 9.5px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border-radius: 4px; padding: 0 4px; }
  .cal-chip { background: var(--terracotta-bg); color: #6e2f12; border-radius: 6px; padding: 3px 6px; font-size: 11.5px; line-height: 1.3; min-width: 0; }
  .cal-chip b { display: flex; align-items: center; gap: 5px; font-weight: 700; }
  .cal-chip b span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .cal-chip i { display: block; font-style: normal; color: #8a3a17; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-chip.blk { background: var(--bg-2); color: var(--ink-2); }
  .cal-chip.blk i { color: var(--muted); }
  .cal-due { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
  .cal-more { font-size: 11.5px; color: var(--muted); padding-left: 3px; }
  .cal-count { display: none; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .cal-legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-sw { width: 16px; height: 10px; border-radius: 3px; display: inline-block; }
  .cal-legend .cal-hint { margin-left: auto; }
  /* stays timeline */

<script>
/* ============================================================
   SOURCE — Supabase, and nothing else.

   The Cowork build of this dashboard read the Google Sheet "THEPIC~3" as its
   book of record and used the database only to cross-check it. A browser cannot
   read a Drive document without Google OAuth, so the hosted build inverts that:
   the database is the single source.

   That is safe because of the 2026-09-03 backfill. The four sheet-only bookings
   (Danyela, Aman, Harshit Agarwal, Siddhart Kanungoo) are now rows 150-153,
   per-booking costs live in booking_costs, and the workbook's Expenses tab is
   mirrored into public.expenses by the sync. Verified live before this rewrite:

       picnic  13 bookings  revenue 193,014  cost 56,918  profit 136,096
       stay    28 bookings  revenue 302,842  cost  1,855  profit 300,987

   — identical to the workbook's own Dashboard tab. Nothing is lost by dropping
   the sheet leg. What IS gone is the sheet-vs-live reconciliation: with one
   source there is nothing to reconcile, so the mismatch and unsynced machinery
   below is inert by construction rather than by luck.

   SECURITY — read this before changing any query.
   The anon key below is public by design; it is the browser's ticket to the API,
   not a credential. Every byte of protection comes from RLS, verified live
   2026-09-03 against the REST endpoint and by simulating a session in Postgres:

       anon                          bookings 0   expenses 0   costs 0
       authenticated, non-admin      bookings 3   expenses 0   costs 0
                                     (their OWN rows, via customer_select_own_bookings)
       authenticated, admin          bookings 67  expenses 6

   Only auth.email() = 'aksh.eeev@gmail.com' can read the business data.
   🔴 Adding an anon SELECT policy to bookings or expenses would make customer
   names, phones, emails and revenue world-readable at this URL. Don't.
   ============================================================ */
const SUPABASE_URL  = 'https://evmftrogyzoudiccqkya.supabase.co';
const SUPABASE_ANON  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2bWZ0cm9neXpvdWRpY2Nxa3lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTM5OTUsImV4cCI6MjA5NTI4OTk5NX0.ka2tLAY7xpe08X8TlNVgft4V__Qv7Ol27rd0daOtI4I';

/* Region scope: this dashboard is the Gurugram & Delhi book. Jaipur has its own. */
const CITIES = ['Gurugram', 'Delhi'];
/* Standing exclusions (CLAUDE.md §8): team phones + Test* names. */
const TEAM_PHONES = ['7742363777', '7425055501'];

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: true, autoRefreshToken: true },
});

const MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
const MON_LBL = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

/* ---------- primitives ---------- */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(v) {
  if (v == null) return 0;
  const s = String(v).replace(/₹/g, '').replace(/,/g, '').trim();
  if (s === '' || s === '-' || s === '—') return 0;
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function inr(n) { const v = Math.round(Number(n) || 0); return '₹' + v.toLocaleString('en-IN'); }
function inrShort(n) {
  const v = Math.round(Number(n) || 0);
  if (Math.abs(v) >= 100000) return '₹' + (v/100000).toFixed(1).replace(/\.0$/,'') + 'L';
  if (Math.abs(v) >= 1000) return '₹' + (v/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return '₹' + v;
}
/* Sheet dates are "13-Jun-2026"; DB dates and the Booked On column are ISO "2026-06-13". */
function parseDate(s) {
  if (!s) return null;
  const t = String(s).trim();
  let m = t.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if (m && MONTHS[m[2]] !== undefined) return new Date(Number(m[3]), MONTHS[m[2]], Number(m[1]));
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return null;
}
function fmtDate(d) { return d ? `${String(d.getDate()).padStart(2,'0')} ${MON_LBL[d.getMonth()]} ${d.getFullYear()}` : '—'; }
function fmtShort(d) { return d ? `${String(d.getDate()).padStart(2,'0')} ${MON_LBL[d.getMonth()]}` : '—'; }
function monthKey(d) { return d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` : ''; }
function monthLabel(k) { const [y,m] = k.split('-'); return `${MON_LBL[Number(m)-1]} ${y}`; }
function prevMonthKey(k) { const [y,m] = k.split('-').map(Number); const d = new Date(y, m - 2, 1); return monthKey(d); }
function daysFromToday(d) { return d ? Math.round((d - TODAY) / 86400000) : null; }
function isoDate(d) { return d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : ''; }
/* Calendar date helpers. Everything in the calendar is keyed by 'YYYY-MM-DD'
   strings. "Today" is the business's day (Asia/Kolkata), not the browser's —
   same rule as the staff tool's sttIstToday(). */
function istTodayIso() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function isoToDate(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function addDaysIso(s, n) { const d = isoToDate(s); d.setDate(d.getDate() + n); return isoDate(d); }
function nightsBetween(a, b) { return Math.round((isoToDate(b) - isoToDate(a)) / 86400000); }
/* The Drive markdown-table parser and the MCP response unwrappers that used to
   live here are gone with the sheet leg — supabase-js returns parsed JSON. */

/* ---------- state ---------- */
const S = {
  records: [], dbRows: [], dbOk: false, sheetOk: false, dbErr: '',
  filters: { basis: 'event', month: 'all', type: 'all', venue: 'all', channel: 'all', status: 'all', q: '', upcoming: false, owing: false, exposed: false },
  detail: false,          // presentation mode is the default; detail reveals ops plumbing
  healthOpen: false,
  // Owed-to-me is a VIEW of the bookings table, not a filter. It deliberately sits
  // outside S.filters so opening it can never re-scope the hero metrics or charts —
  // profit and revenue must keep answering for the period you selected.
  owedOpen: false,
  charts: {},
};

/* ---------- load ----------
   One round trip per table, in parallel. Every one of these is RLS-gated to the
   admin email, so an unauthenticated or non-admin session gets [] rather than an
   error — which is why load() checks for an empty bookings set explicitly. */
async function load() {
  const availFrom = addDaysIso(istTodayIso(), -60), availTo = addDaysIso(istTodayIso(), 400);
  const [bkRes, costRes, addRes, expRes, occRes, venRes, avRes] = await Promise.all([
    sb.from('bookings')
      .select('id, full_name, mobile_number, preferred_date, checkout_date, time_slot, occasion, ' +
              'total_amount, advance_amount, payment_status, entry_source, external_booking_ref, ' +
              'created_at, venue_id, guest_count, package_name, booking_kind, venues!inner(name, city, type)')
      .eq('confirmed', true)
      .in('venues.city', CITIES)
      .order('preferred_date', { ascending: false }),
    sb.from('booking_costs').select('booking_id, total_cost, closed_at, close_notes'),
    sb.from('booking_add_ons').select('booking_id, name, price_at_booking'),
    sb.from('expenses').select('spend_date, business, city, category, description, amount'),
    /* monthly_occupancy_self_managed is a view (security_invoker=true, RLS-gated
       same as bookings) — nights booked / active days since the venue went live,
       for active self_managed (TerraCottage) venues only. A missing table on an
       older DB shouldn't break the whole dashboard load, so its error is not
       thrown below — just surfaced as an empty occupancy section. */
    sb.from('monthly_occupancy_self_managed').select('venue_id, venue_name, month, active_days, nights_booked, occupancy_pct'),
    /* Calendar only. venues gives capacity (max_concurrent_setups) and the
       combo parent/child links; venue_availability gives Airbnb iCal nights and
       admin blocks. Both are readable by any signed-in user (their RLS is not
       admin-only — the public site's availability calendar reads them), and
       neither carries customer data. Like occupancy, a failure here must not
       take the dashboard down: the calendar just shows bookings without them. */
    sb.from('venues').select('id, name, type, city, is_active, parent_venue_id, max_concurrent_setups')
      .in('city', CITIES),
    sb.from('venue_availability').select('venue_id, date, source, time_slot')
      .in('source', ['ical', 'admin']).gte('date', availFrom).lte('date', availTo),
  ]);

  for (const [label, res] of [['bookings', bkRes], ['costs', costRes], ['add-ons', addRes], ['expenses', expRes]]) {
    if (res.error) throw new Error(`Could not read ${label} — ${res.error.message}`);
  }
  S.occupancy = (occRes && !occRes.error) ? (occRes.data || []) : [];
  S.venues = (venRes && !venRes.error) ? (venRes.data || []) : [];
  S.avail = (avRes && !avRes.error) ? (avRes.data || []) : [];
  S.calDataErr = (venRes && venRes.error) || (avRes && avRes.error) ? 'Airbnb blocks and venue capacity could not be read; bookings are still shown.' : '';
  S.loadedAt = Date.now();
  const raw = bkRes.data || [];
  if (!raw.length) throw new Error('Signed in, but no bookings came back. This account does not have read access to the business data.');
  S.dbOk = true; S.sheetOk = true;

  const costBy = new Map();
  (costRes.data || []).forEach(c => costBy.set(String(c.booking_id), c));
  const addBy = new Map();
  (addRes.data || []).forEach(a => {
    const k = String(a.booking_id);
    if (!addBy.has(k)) addBy.set(k, []);
    addBy.get(k).push(a);
  });

  S.expenses = (expRes.data || [])
    .filter(e => money(e.amount) > 0)
    .map(e => ({
      date: parseDate(e.spend_date),
      business: String(e.business || '').trim() || '—',
      city: String(e.city || '').trim(),
      category: String(e.category || '').trim() || '—',
      description: String(e.description || '').trim(),
      amount: money(e.amount),
    }));

  /* Standing exclusions (CLAUDE.md §8) applied client-side rather than in the
     query, so the filter lives next to the comment explaining it. */
  const kept = raw.filter(r =>
    !TEAM_PHONES.includes(String(r.mobile_number || '').trim()) &&
    !/^test/i.test(String(r.full_name || '').trim()));

  const recs = kept.map(r => {
    const isStay = !!r.checkout_date;
    const start = parseDate(r.preferred_date);
    const end = isStay ? parseDate(r.checkout_date) : null;
    const nights = (isStay && start && end) ? Math.max(0, Math.round((end - start) / 86400000)) : 0;
    const total = money(r.total_amount);
    const advance = money(r.advance_amount);
    const cost = money((costBy.get(String(r.id)) || {}).total_cost);

    /* Channel. external_booking_ref is free text and mixes two different things:
       real Airbnb confirmation codes (HM + 8 alphanumerics, sometimes with an
       AIRBNB- prefix) and hand-typed provenance notes — "WhatsApp", "Direct",
       "direct-extension", and the bare word "Airbnb".
       🔴 The code test alone is not enough: bookings #142 and #143 are genuine
       platform stays whose ref is literally "Airbnb", and a code-only check
       filed both under Direct. Both forms have to be accepted. */
    const ref = String(r.external_booking_ref || '').trim();
    const bare = ref.replace(/^AIRBNB-/i, '');
    const viaAirbnb = isStay && (/^HM[A-Z0-9]{8}$/i.test(bare) || /^airbnb$/i.test(ref));
    const channel = isStay
      ? (viaAirbnb ? 'Airbnb' : 'Direct')
      : (String(r.entry_source || '') === 'admin' ? 'Direct' : 'Website');

    return {
      kind: isStay ? 'stay' : 'picnic',
      bookingId: '#' + r.id,
      venue: (r.venues && r.venues.name) || '—',
      city: (r.venues && r.venues.city) || '',
      name: r.full_name || '',
      phone: r.mobile_number || '',
      date: start, endDate: end, nights,
      /* created_at is UTC; the business runs on IST, and a booking made at
         02:00 IST belongs to that day, not the previous one. */
      bookedOn: r.created_at ? new Date(new Date(r.created_at).getTime() + 5.5 * 3600000) : null,
      occasion: r.occasion || '',
      channel,
      total, advance,
      balance: Math.max(0, total - advance),
      netProfit: total - cost,
      cost,
      addOns: addBy.get(String(r.id)) || [],
      /* 🔴 payment_status is NOT the truth flag. CLAUDE.md §6: admin-entered and
         offline-collected bookings stay 'pending' forever by design, so keying
         "paid" off it would report every manual booking as owing. The money
         columns are the truth — advance_amount is raised to total_amount when a
         booking is settled. This reproduces the workbook's ₹38,600 outstanding
         exactly (Amy 15,200 + Simran 14,900 + Nitij 8,500), verified 2026-09-03. */
      payment: advance >= total && total > 0 ? 'Paid' : 'Advance Paid',
      status: (start && start < TODAY) ? 'Completed' : 'Confirmed',
      bkid: String(r.id),
      /* Calendar fields. bookingKind is bookings.booking_kind (picnic | stay |
         picnic_stay); the calendar prefers it over the checkout_date shape,
         which cannot tell a picnic AT a stay property from a stay. kind above
         is left alone — every revenue figure on this page keys on it. */
      venueId: r.venue_id, venueType: (r.venues && r.venues.type) || '',
      guests: r.guest_count, pkg: r.package_name || '', slot: r.time_slot || '',
      bookingKind: r.booking_kind || '',
    };
  });
  // Fold venue spelling variants onto the most common form.
  const variants = new Map();
  recs.forEach(r => {
    const k = String(r.venue || '').toLowerCase().replace(/\s+/g, ' ').trim();
    if (!k) return;
    if (!variants.has(k)) variants.set(k, new Map());
    const c = variants.get(k); c.set(r.venue, (c.get(r.venue) || 0) + 1);
  });
  const canonical = new Map();
  variants.forEach((counts, k) => { let best = null, n = -1; counts.forEach((cnt, name) => { if (cnt > n) { n = cnt; best = name; } }); canonical.set(k, best); });
  recs.forEach(r => { const k = String(r.venue || '').toLowerCase().replace(/\s+/g, ' ').trim(); if (canonical.has(k)) r.venue = canonical.get(k); });

  // Payment Status is authoritative: Paid => fully collected, zero balance.
  recs.forEach(r => {
    r.paid = (r.payment || '').trim().toLowerCase() === 'paid';
    r.collected = r.paid ? r.total : r.advance;
    r.balance = r.paid ? 0 : Math.max(0, r.total - r.advance);
    r.share = 1; r.shareNights = r.nights;
  });
  S.records = recs;

  /* --- reconciliation: nothing to reconcile ---
     The Cowork build compared each sheet row against the live booking it matched
     (by _bkid, else phone+date) and raised a mismatch when the two totals
     disagreed. With the database as the only source, a row cannot disagree with
     itself. These fields stay on every record because the renderer reads them;
     they are now constants rather than findings, and the Data health strip has
     been reworded to say so instead of claiming a clean reconciliation it never
     performed. */
  S.dbRows = recs;
  S.records.forEach(r => {
    r.live = r; r.linkedBy = 'db'; r.mismatch = null;
    r.expectedLive = true; r.unsynced = false;
    r.future = r.date ? r.date >= TODAY : false;
    r.exposed = false;
  });
  S.orphans = [];
  S.dupWarnings = [];

  // Default the month to the latest month that has bookings, so the hero opens
  // on a real period rather than an all-time blur. 'All months' stays available.
  const mk = months().filter(k => k <= monthKey(TODAY));
  if (mk.length) S.filters.month = mk[0];
}

/* ---------- reporting basis ----------
   'event'  — when delivered. Stays are split PER NIGHT across the months they cover.
   'booked' — when committed (sheet `Booked On`, from bookings.created_at, IST).
   Returns [{ k, share, nights }]; shares sum to 1 across the returned months. */
function spans(r, basisOverride) {
  const basis = basisOverride || S.filters.basis || 'event';
  const whole = (d, n) => { const k = monthKey(d); return k ? [{ k, share: 1, nights: n || 0 }] : []; };
  if (basis === 'booked') return whole(r.bookedOn || r.date, r.nights);   // hand-entered rows fall back to event date
  if (r.kind !== 'stay' || !r.date || !r.endDate) return whole(r.date, r.nights);
  const n = Math.round((r.endDate - r.date) / 86400000);
  if (!(n > 0)) return whole(r.date, r.nights);
  const per = {}; const d = new Date(r.date.getTime());
  for (let i = 0; i < n; i++) { const k = monthKey(d); if (k) per[k] = (per[k] || 0) + 1; d.setDate(d.getDate() + 1); }
  const keys = Object.keys(per).sort();
  if (!keys.length) return whole(r.date, r.nights);
  return keys.map(k => ({ k, share: per[k] / n, nights: per[k] }));
}
function bookedOnGaps() { return S.records.filter(r => !r.bookedOn).length; }

/* ---------- filtering ---------- */
function months() {
  const set = new Set();
  S.records.forEach(r => spans(r).forEach(s => { if (s.k) set.add(s.k); }));
  (S.expenses || []).forEach(e => { const k = monthKey(e.date); if (k) set.add(k); });
  return Array.from(set).sort().reverse();
}
function uniq(fn) { return Array.from(new Set(S.records.map(fn).filter(v => v && String(v).trim()))).sort(); }
/* 🔴 view() must NEVER write share/shareNights back onto the shared record.
   It used to (`r.share = hit.share`), and every later view() with a different
   month clobbered the share the table was about to render: mom() compares the
   selected month against the previous one via view({month: prev}), and
   drawCharts' base is view({month:'all'}). Last writer won. Booking #115
   (Amy Bomjen, 31 Aug → 6 Sep, ₹19,000 / 6 nights) rendered inside the
   September view with August's 1/6 share — ₹3,167 and a "17%" split tag —
   instead of 5/6, ₹15,833, 83%. It silently understated every month that had a
   boundary-straddling stay, in the amount column, the ✂️ split alert, the night
   count and every sumShare() total. Each call now returns its own prorated
   copies; S.records keeps share = 1 for good, which is what the never-prorated
   owed/upcoming lists read. Found 2026-09-15. */
function view(overrides) {
  const f = overrides ? Object.assign({}, S.filters, overrides) : S.filters;
  const q = (f.q || '').trim().toLowerCase();
  const out = [];
  S.records.forEach(r => {
    let share = 1, shareNights = r.nights;
    if (f.month !== 'all') {
      const hit = spans(r, f.basis).find(s => s.k === f.month);
      if (!hit) return;
      share = hit.share; shareNights = hit.nights;
    }
    if (keep(r)) out.push(Object.assign({}, r, { share, shareNights }));
  });
  return out;

  function keep(r) {
    if (f.type !== 'all' && r.kind !== f.type) return false;
    if (f.venue !== 'all' && r.venue !== f.venue) return false;
    if (f.channel !== 'all' && r.channel !== f.channel) return false;
    if (f.status !== 'all') {
      const p = (r.payment || '').toLowerCase(), b = (r.status || '').toLowerCase();
      if (f.status === 'paid' && p !== 'paid') return false;
      if (f.status === 'pending' && p === 'paid') return false;
      if (f.status === 'confirmed' && b !== 'confirmed') return false;
      if (f.status === 'completed' && b !== 'completed') return false;
    }
    if (f.upcoming && !r.future) return false;
    if (f.owing && !(r.balance > 0)) return false;
    if (f.exposed && !r.exposed) return false;
    if (q) { const hay = [r.name, r.venue, r.bookingId, r.occasion, r.channel, r.phone].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }
}
function filtered() { return view(); }
function sumShare(rows, fn) { return rows.reduce((s, r) => s + (Number(fn(r)) || 0) * (r.share == null ? 1 : r.share), 0); }
function expFiltered() { const f = S.filters; return (S.expenses || []).filter(e => !(f.month !== 'all' && monthKey(e.date) !== f.month)); }

/* Month-on-month. Compares the selected month with the immediately preceding
   calendar month on the SAME basis and the same non-month filters, so the two
   figures are like-for-like. Returns null when no month is selected or the prior
   month has nothing — a fake "+100%" against an empty month is worse than silence. */
function monthTotals(k) {
  const rows = view({ month: k });
  return { revenue: sumShare(rows, r => r.total), profit: sumShare(rows, r => r.netProfit), count: rows.length };
}
function mom(metric) {
  const f = S.filters;
  if (f.month === 'all') return null;
  const cur = monthTotals(f.month), prev = monthTotals(prevMonthKey(f.month));
  if (!prev.count) return { first: true };
  const a = cur[metric], b = prev[metric];
  if (!b) return { first: true };
  return { pct: (a - b) / Math.abs(b) * 100, abs: a - b, prevLabel: monthLabel(prevMonthKey(f.month)) };
}
function chip(d) {
  if (!d) return '';
  if (d.first) return `<span class="chip flat">first month</span>`;
  const up = d.abs >= 0, cls = Math.abs(d.pct) < 0.5 ? 'flat' : (up ? 'up' : 'down');
  const arrow = cls === 'flat' ? '—' : (up ? '▲' : '▼');
  return `<span class="chip ${cls}" title="vs ${esc(d.prevLabel)}: ${up ? '+' : '−'}${inr(Math.abs(d.abs))}">${arrow} ${Math.abs(d.pct).toFixed(0)}%</span>`;
}

function pnlSummary() {
  const tb = view({ type: 'all' });
  const picnicProfit = sumShare(tb.filter(r => r.kind === 'picnic'), r => r.netProfit);
  const stayProfit   = sumShare(tb.filter(r => r.kind === 'stay'), r => r.netProfit);
  const exp = expFiltered();
  const expTotal = exp.reduce((s, e) => s + e.amount, 0);
  const bizTot = key => exp.filter(e => String(e.business).toLowerCase().includes(key)).reduce((s, e) => s + e.amount, 0);
  const expPicnic = bizTot('picnic'), expAirbnb = bizTot('airbnb'), expShared = bizTot('shared');
  return { picnicProfit, stayProfit, exp, expTotal, expPicnic, expAirbnb, expShared, expOther: expTotal - expPicnic - expAirbnb - expShared, overallNet: picnicProfit + stayProfit - expTotal };
}
function toggleFilter(key, value) {
  if (key === 'type') S.filters.type = (S.filters.type === value) ? 'all' : value;
  else S.filters[key] = !S.filters[key];
  render();
}
window.toggleFilter = toggleFilter;
window.toggleDetail = () => { S.detail = !S.detail; document.body.classList.toggle('detail', S.detail); render(); };
window.toggleHealth = () => { S.healthOpen = !S.healthOpen; render(); };
/* Owed-to-me card: swaps the bookings table for every booking carrying a balance,
   across all periods. It touches NO filter state — the hero cards, charts, KPIs and
   P&L keep answering for the period and filters you chose. */
window.showOwed = () => {
  S.owedOpen = !S.owedOpen;
  render();
  if (S.owedOpen) { const el = document.getElementById('t-all'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
};

/* ---------- table renderer ---------- */
function makeTable(mount, rows, cols, defIdx, defDir, emptyMsg) {
  let si = defIdx, sd = defDir || 1;
  function draw() {
    if (!rows.length) { mount.innerHTML = `<div class="empty">${esc(emptyMsg || 'No bookings match these filters.')}</div>`; return; }
    const sorted = rows.slice().sort((a, b) => {
      const c = cols[si];
      let av = c.sort ? c.sort(a) : a[c.key], bv = c.sort ? c.sort(b) : b[c.key];
      if (av == null) av = ''; if (bv == null) bv = '';
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sd;
      return String(av).localeCompare(String(bv)) * sd;
    });
    mount.innerHTML = '<div class="tscroll"><table><thead><tr>' +
      cols.map((c, i) => `<th data-i="${i}" class="${c.num ? 'num' : ''}">${esc(c.label)}${si === i ? `<span class="ar">${sd === 1 ? '▲' : '▼'}</span>` : ''}</th>`).join('') +
      '</tr></thead><tbody>' +
      sorted.map(r => `<tr class="${r.exposed && S.detail ? 'flagged' : ''}">` + cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('') + '</tr>').join('') +
      '</tbody></table></div>';
    mount.querySelectorAll('th').forEach(th => th.addEventListener('click', () => { const i = Number(th.dataset.i); if (si === i) sd *= -1; else { si = i; sd = 1; } draw(); }));
  }
  draw();
}
function payBadge(r) {
  const p = (r.payment || '').trim().toLowerCase();
  if (p === 'paid') return '<span class="badge b-paid">Paid</span>';
  if (p === 'pending') return '<span class="badge b-pending">Pending</span>';
  if (p === 'advance paid' || p === 'partial') return `<span class="badge b-pending">${esc(r.payment)}</span>`;
  return `<span class="badge b-plain">${esc(r.payment || '—')}</span>`;
}
/* Was a sync badge: sheet row vs live row, and how they were matched. With one
   source every row would read the same thing, so it now carries the booking's
   channel instead — which is the question a partner actually asks of a row. */
function syncBadge(r) {
  if (r.channel === 'Airbnb') return '<span class="badge b-airbnb">Airbnb</span>';
  if (r.channel === 'Website') return '<span class="badge b-live">Website</span>';
  return '<span class="badge b-plain">Direct</span>';
}
function kindBadge(r) { return r.kind === 'picnic' ? '<span class="badge b-picnic">Picnic</span>' : '<span class="badge b-stay">Stay</span>'; }

        ${owedRows.length ? `<ul class="debt">
